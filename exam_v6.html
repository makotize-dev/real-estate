<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <title>宅建士 想起トレーナー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        :root {
            --bg-page: #f0f2f5;
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.07);
            --shadow-md: 0 6px 20px rgba(0,0,0,0.10);
        }
        body { font-family: 'Syne','Noto Sans JP',sans-serif; background: var(--bg-page); }
        h1,h2,h3 { font-family: 'Syne','Noto Sans JP',sans-serif; }
        .view { display:none; }
        .view.active { display:block; }
        .opt-btn {
            width:100%; text-align:left; border:1.5px solid #e2e8f0; background:#fff;
            border-radius:0.9rem; padding:0.9rem 1.1rem; font-weight:700; font-size:1rem;
            transition: all .15s ease; cursor:pointer;
        }
        .opt-btn:hover:not(:disabled) { border-color:#93c5fd; }
        .opt-btn:disabled { cursor:default; }
        .opt-btn.correct { background:#10b981; border-color:#10b981; color:#fff; }
        .opt-btn.wrong   { background:#ef4444; border-color:#ef4444; color:#fff; }
        .opt-btn.muted   { opacity:.5; }
        .opt-btn.choice  { font-weight:500; font-size:0.95rem; line-height:1.65; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:none;} }
        .fade-up { animation: fadeUp .25s ease; }
        /* 科目色 */
        .c-gyo { color:#2563eb; } .bg-gyo{ background:#2563eb; } .bd-gyo{ border-color:#2563eb; }
        .c-ken { color:#ea580c; } .bg-ken{ background:#ea580c; } .bd-ken{ border-color:#ea580c; }
        .c-hou { color:#059669; } .bg-hou{ background:#059669; } .bd-hou{ border-color:#059669; }
        .c-zei { color:#7c3aed; } .bg-zei{ background:#7c3aed; } .bd-zei{ border-color:#7c3aed; }
    </style>
</head>
<body class="text-slate-800">
<div class="max-w-2xl mx-auto px-4 py-6">

    <!-- ============ ホーム ============ -->
    <section id="view-home" class="view active">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-slate-900">宅建士 想起トレーナー</h1>
            <p class="text-sm text-slate-500 mt-1">学習済みの論点を「閉じた状態」で思い出す練習</p>
        </header>

        <div class="bg-white rounded-2xl shadow-sm border p-5 mb-5">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-bold text-slate-700">科目を選んで開始</h2>
                <span id="total-count" class="text-xs font-bold text-slate-400"></span>
            </div>
            <div id="subject-grid" class="grid grid-cols-2 gap-3"></div>
        </div>

        <div class="grid grid-cols-1 gap-3 mb-5">
            <button id="due-btn" onclick="start('due')" class="bg-white border-2 border-amber-300 text-amber-700 hover:bg-amber-50 font-bold py-3.5 rounded-xl transition">
                今日の想起（期限が来た問） <span id="due-count" class="text-xs"></span>
            </button>
            <button onclick="start('all')" class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl transition">全科目まぜて出題</button>
            <button id="wrong-btn" onclick="start('wrong')" class="bg-white border-2 border-red-300 text-red-600 hover:bg-red-50 font-bold py-3.5 rounded-xl transition">
                間違いだけ再テスト <span id="wrong-count" class="text-xs"></span>
            </button>
            <button id="export-btn" onclick="exportWrong()" class="bg-white border-2 border-slate-300 text-slate-600 hover:bg-slate-50 font-bold py-3 rounded-xl transition text-sm">
                誤答リストを書き出す（.md）
            </button>
        </div>

        <div id="last-result" class="hidden bg-blue-50 border border-blue-100 rounded-xl p-4 text-sm text-blue-900 text-center mb-5"></div>

        <p class="text-xs text-slate-400 text-center leading-relaxed">
            一問一答（○×）と4肢択一。各問に根拠条文を表示。<br>
            「今日の想起」は各問の次回出題日（study_log/宿題.md と対応）で選びます。
        </p>
    </section>

    <!-- ============ 出題 ============ -->
    <section id="view-quiz" class="view">
        <div class="flex items-center justify-between mb-3">
            <button onclick="goHome()" class="text-xs text-slate-400 hover:text-slate-600">← 中断</button>
            <span id="q-counter" class="text-xs font-bold text-slate-500"></span>
        </div>
        <div class="h-1.5 bg-slate-200 rounded-full overflow-hidden mb-5">
            <div id="q-progress" class="h-full bg-slate-700 transition-all duration-300" style="width:0%"></div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
            <div class="p-6">
                <div class="mb-3">
                    <span id="q-subject" class="text-xs font-bold px-2.5 py-1 rounded-full"></span>
                    <span id="q-topic" class="text-xs text-slate-400 ml-1"></span>
                </div>
                <p id="q-text" class="text-lg font-bold leading-relaxed mb-6"></p>
                <div id="q-options" class="space-y-3"></div>
                <div id="q-explain" class="hidden mt-5 p-4 rounded-xl text-sm fade-up"></div>
                <div class="text-right mt-5">
                    <button id="q-next" onclick="next()" class="hidden bg-slate-900 hover:bg-slate-800 text-white font-bold px-7 py-2.5 rounded-full transition text-sm"></button>
                </div>
            </div>
        </div>
    </section>

    <!-- ============ 結果 ============ -->
    <section id="view-result" class="view">
        <div class="bg-white rounded-2xl shadow-sm border p-6 text-center mb-5">
            <p class="text-sm text-slate-500 mb-1">結果</p>
            <p id="r-score" class="text-6xl font-extrabold text-slate-900 mb-2"></p>
            <p id="r-pct" class="text-sm font-bold text-slate-500"></p>
            <div id="r-breakdown" class="mt-5 space-y-2 text-left text-sm"></div>
        </div>
        <div id="r-wrong-list" class="hidden bg-white rounded-2xl shadow-sm border p-5 mb-5">
            <h3 class="font-bold text-slate-700 mb-3 text-sm">今回間違えた問題</h3>
            <ol id="r-wrong-items" class="space-y-2 text-sm list-decimal list-inside text-slate-700"></ol>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
            <button id="r-retry-wrong" onclick="start('wrong')" class="bg-white border-2 border-red-300 text-red-600 hover:bg-red-50 font-bold py-3 rounded-xl transition text-sm">間違いだけ復習</button>
            <button onclick="goHome()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition text-sm">ホームへ</button>
        </div>
        <button onclick="exportWrong()" class="w-full bg-white border-2 border-slate-300 text-slate-600 hover:bg-slate-50 font-bold py-3 rounded-xl transition text-sm">誤答リストを書き出す（.md）</button>
    </section>

</div>

<script>
/* =========================================================
   法令の e-Gov 法令単位リンク（laws.md より）
   ========================================================= */
const LAWS = {
    '宅建業法':   'https://laws.e-gov.go.jp/document?lawid=327AC1000000176',
    '民法':       'https://laws.e-gov.go.jp/document?lawid=129AC0000000089',
    '借地借家法': 'https://laws.e-gov.go.jp/document?lawid=403AC0000000090',
    '都市計画法': 'https://laws.e-gov.go.jp/document?lawid=343AC0000000100',
    '建築基準法': 'https://laws.e-gov.go.jp/document?lawid=325AC0000000201',
    '農地法':     'https://laws.e-gov.go.jp/document?lawid=327AC0000000229',
    '地方税法':   'https://laws.e-gov.go.jp/document?lawid=325AC0000000226',
    '地価公示法': 'https://laws.e-gov.go.jp/document?lawid=344AC0000000049',
};

/* 科目メタ（色・略号・study_notes リンク） */
const SUBJECTS = {
    '宅建業法':  { key:'gyo', note:'study_notes.html' },
    '権利関係':  { key:'ken', note:'study_notes.html' },
    '法令制限':  { key:'hou', note:'study_notes.html' },
    '税・その他':{ key:'zei', note:'study_notes.html' },
};

/* =========================================================
   問題バンク（すべて e-Gov 逐語確認済み）

   ○×の問：choices を持たない。answer: true = 文は正しい(○) / false = 誤り(×)
   4肢の問：choices に4つの肢を配列で持ち、answer は正答の添字（0〜3）
            q に「誤っているものはどれか」等の問い方を書く
   due    ：想起の次回出題日 'YYYY-MM-DD'（study_log/宿題.md 2の3 と対応）。
            ホームの「今日の想起」はこの日付が今日以前の問だけを出す。
            localStorage を使わないので閲覧データを削除しても消えない。
            消化したら宿題.md の間隔（1日後・4日後・11日後）に従って手で書き換える。
   law: LAWS のキー / source: 表示する根拠条文
   ========================================================= */
const QUESTIONS = [
  // ---- 宅建業法 ----
  { id:'gyo-35-01', subject:'宅建業法', topic:'重要事項説明(35条)', law:'宅建業法', source:'宅建業法35条1項',
    q:'重要事項の説明は、契約が成立するまでの間に、宅地建物取引士が行わなければならない。',
    answer:true,
    explain:'正しい。35条1項は「契約が成立するまでの間に、宅地建物取引士をして…説明をさせなければならない」と定める。説明主体は宅建士に限られる。' },
  { id:'gyo-35-02', subject:'宅建業法', topic:'重要事項説明(35条)', law:'宅建業法', source:'宅建業法35条4項',
    q:'宅地建物取引士は、重要事項の説明をするとき、相手方から請求があった場合に限り宅地建物取引士証を提示すればよい。',
    answer:false,
    explain:'誤り。35条4項は「説明をするときは…宅地建物取引士証を提示しなければならない」。請求の有無にかかわらず提示が必要（請求があれば提示の22条の4とは別）。' },
  { id:'gyo-35-03', subject:'宅建業法', topic:'重要事項説明(35条)', law:'宅建業法', source:'宅建業法35条6項',
    q:'相手方が宅地建物取引業者である取引では、35条書面の交付は必要だが、宅地建物取引士による説明は省略できる。',
    answer:true,
    explain:'正しい。35条6項は業者間取引について、説明義務の部分を「書面を交付しなければ」と読み替え、士証提示(4項)・記名(5項)を適用しない。ただし記名は7項が課し直すので最終的に残る＝業者間で外れるのは「説明」と「士証の提示」、残るのは「書面の交付」と「宅建士の記名」。またこの特例の対象は1項・2項だけで、3項（信託の受益権の売主となる場合）には及ばない。' },
  { id:'ho-kb6-01', subject:'法令制限', topic:'建築確認の3号＝都市計画区域内は規模不問(建基法6条1項3号)', law:'建築基準法', source:'建築基準法6条1項1〜3号',
    q:'都市計画区域内において、平家建て・延べ面積100㎡の一戸建て住宅（特殊建築物ではない）を新築する場合、規模が小さいため建築確認を受ける必要はない。',
    answer:false,
    explain:'誤り。6条1項は号によって軸が入れ替わる。1号（特殊建築物200㎡超）・2号（2以上の階数又は延べ面積200㎡超）は場所を問わないかわりに規模を問うが、3号は「都市計画区域…内における建築物」とだけ定め規模の要件がない。したがって都市計画区域内なら平家100㎡でも3号で確認が必要。号の規模要件だけを見て場所の網を見落とすのが典型の誤り。令和2年問17。' },
  { id:'gyo-35-05', subject:'宅建業法', topic:'35条3項ただし書は交付も説明も落ちる（6項との違い）', law:'宅建業法', source:'宅建業法35条3項ただし書・6項／施行規則16条の4の4第1号',
    q:'宅地建物取引業者Aが自らを委託者とする建物に係る信託の受益権の売主となる場合において、売買の相手方が金融商品取引法に規定する特定投資家であるときは、Aは重要事項説明書の交付は行わなければならないが、宅地建物取引士による説明は要しない。',
    answer:false,
    explain:'誤り。35条3項ただし書は「国土交通省令で定める場合は、この限りでない」とし、規則16条の4の4第1号が特定投資家を挙げる。「この限りでない」が受けているのは本文の「書面を交付して説明をさせなければならない」全体なので、交付も説明も不要になる。交付だけ残るのは6項の業者間特例（1項・2項に限る）であり、3項ただし書とは効き方が違う。6項は「読み替える」ので義務が形を変えて残り、ただし書は本文ごと落ちる。' },
  { id:'gyo-35-04', subject:'宅建業法', topic:'区分所有建物の貸借と規則16条の2の柱書', law:'宅建業法', source:'宅建業法35条1項6号／施行規則16条の2柱書・6号',
    q:'宅地建物取引業者Aは、区分所有建物である甲マンションの一室について貸借の媒介を行う。甲マンションには計画的な維持修繕のための費用の積立てを行う旨の規約の定めがあり、既に相当額が積み立てられている。この場合Aは、借主に対し、その規約の内容及び既に積み立てられている額を説明しなければならない。',
    answer:false,
    explain:'誤り。施行規則16条の2の柱書は「建物の貸借の契約にあつては第三号及び第八号に掲げるもの」と限定しており、積立ての規約（6号）は建物の貸借では説明事項に入らない。6号の「その内容及び既に積み立てられている額」が必要なのは建物の貸借以外（売買・交換）。令和2年問44肢4は同じ6号を売買の媒介で問い、既積立額の説明は不要としたため誤りだった。号を覚えても柱書の範囲切りを読まなければ判定できない。' },
  { id:'gyo-34_2-01', subject:'宅建業法', topic:'媒介契約(34条の2)', law:'宅建業法', source:'宅建業法34条の2第3項',
    q:'専任媒介契約で有効期間を6か月と定めた場合、その特約は無効となり、期間の定めがないものとして扱われる。',
    answer:false,
    explain:'誤り。34条の2第3項は「三月を超えることができない。これより長い期間を定めたときは、その期間は、三月とする」。無効になるのではなく3か月に短縮される。' },
  { id:'gyo-34_2-02', subject:'宅建業法', topic:'媒介契約(34条の2)', law:'宅建業法', source:'宅建業法34条の2第4項',
    q:'専任媒介契約の有効期間は、依頼者の申出がなくても、業者の判断で自動的に更新できる。',
    answer:false,
    explain:'誤り。34条の2第4項は「依頼者の申出により、更新することができる」。自動更新はできず、更新後も3か月を超えられない。' },
  { id:'gyo-34_2-03', subject:'宅建業法', topic:'媒介契約(34条の2)', law:'宅建業法', source:'宅建業法34条の2第9項',
    q:'専属専任媒介契約を結んだ業者は、業務処理状況を1週間に1回以上、依頼者に報告しなければならない。',
    answer:true,
    explain:'正しい。34条の2第9項は専任媒介は2週間に1回以上、自己発見取引禁止特約付き（＝専属専任）は1週間に1回以上の報告を義務づける。' },
  { id:'gyo-3-01', subject:'宅建業法', topic:'免許(3条)', law:'宅建業法', source:'宅建業法3条1項',
    q:'2以上の都道府県の区域内に事務所を設置して宅建業を営もうとする者は、国土交通大臣の免許を受けなければならない。',
    answer:true,
    explain:'正しい。3条1項。2以上の都道府県＝国土交通大臣免許、1の都道府県のみ＝当該所在地の都道府県知事免許。事務所の所在地で決まり、取引相手の所在地では決まらない。' },
  { id:'gyo-5-01', subject:'宅建業法', topic:'免許の基準(5条 欠格事由・破産)', law:'宅建業法', source:'宅建業法5条1項1号',
    q:'破産手続開始の決定を受けた者は、復権を得た場合であっても、その決定の日から5年を経過しなければ免許を受けることができない。',
    answer:false,
    explain:'誤り。5条1項1号の欠格事由は「破産手続開始の決定を受けて復権を得ない者」。復権を得れば直ちに欠格が消え、5年の経過は不要。5年経過が必要なのは免許取消し(2号)・拘禁刑以上の刑(5号)・一定の罪の罰金(6号)等。破産＝復権で即回復、をセットで押さえる。' },
  { id:'gyo-11-01', subject:'宅建業法', topic:'廃業等の届出(11条 破産の届出義務者)', law:'宅建業法', source:'宅建業法11条1項3号',
    q:'宅地建物取引業者について破産手続開始の決定があった場合、その破産者本人が、その日から30日以内にその旨を免許権者に届け出なければならない。',
    answer:false,
    explain:'誤り。11条1項3号の届出義務者は「破産管財人」（本人ではない）。届出はその日から30日以内。なお同項各号で起算日が「その事実を知った日」となるのは1号（死亡・届出義務者は相続人）のみで、破産・解散・廃業は事由発生日から30日。' },
  { id:'gyo-22_2-01', subject:'宅建業法', topic:'宅建士証の交付時の講習(22条の2第2項ただし書)', law:'宅建業法', source:'宅建業法22条の2第2項',
    q:'宅建士証の交付を受けようとする者は、試験に合格した日から1年以内に交付を受けようとする場合であっても、交付の申請前6月以内に行われる知事指定の講習を受講しなければならない。',
    answer:false,
    explain:'誤り。22条の2第2項ただし書で講習が不要になる例外が2つある ── ①試験に合格した日から1年以内に交付を受けようとする者 ②登録の移転に伴う交付（5項）。原則は交付申請前6月以内の講習だが、合格1年以内なら不要。' },
  { id:'gyo-22_2-02', subject:'宅建業法', topic:'宅建士証の返納と提出(22条の2第6項・7項)', law:'宅建業法', source:'宅建業法22条の2第6項・7項・8項',
    q:'宅建士が事務禁止処分を受けたときは、宅建士証をその交付を受けた都道府県知事に返納しなければならない。',
    answer:false,
    explain:'誤り。事務禁止処分のときは「提出」（22条の2第7項）。「返納」（6項）は登録が消除されたとき・宅建士証が効力を失ったとき。提出した士証は禁止期間満了後、提出者の返還請求があれば直ちに返還される（8項）＝戻ってくる点が返納と決定的に違う。' },
  { id:'gyo-37-01', subject:'宅建業法', topic:'契約書面(37条)', law:'宅建業法', source:'宅建業法37条1項8号',
    q:'宅地建物取引業者が自ら売主となる売買契約で37条書面を交付する場合、損害賠償額の予定について定めがないときでも、その旨を必ず記載しなければならない。',
    answer:false,
    explain:'誤り。37条1項8号は「損害賠償額の予定又は違約金に関する定めがあるときは、その内容」＝任意的記載事項。定めがなければ記載不要。引渡しの時期(4号)・移転登記の申請の時期(5号)等の必要的記載事項とは扱いが異なる。' },
  { id:'gyo-37-02', subject:'宅建業法', topic:'契約書面(37条)', law:'宅建業法', source:'宅建業法37条2項',
    q:'建物の貸借の媒介により契約が成立した場合、宅地建物取引業者は37条書面に移転登記の申請の時期を記載しなければならない。',
    answer:false,
    explain:'誤り。37条2項は1項のうち1号・2号・4号・7号・8号・10号のみを掲げ、5号（移転登記の申請の時期）を含まない。賃貸借では所有権が移転しないため。代金(3号)は借賃(2項2号)に置き換わる。' },
  { id:'gyo-37-03', subject:'宅建業法', topic:'35条vs37条(契約書面)', law:'宅建業法', source:'宅建業法35条1項・37条1項3号',
    q:'宅地の売買において、代金の額は、35条の重要事項として説明すべき事項であり、かつ37条書面の記載事項でもある。',
    answer:false,
    explain:'誤り。代金の額は37条1項3号の記載事項（必要的）だが、35条1項には代金の額を説明する号がない（35条7号は「代金・交換差金・借賃以外に授受される金銭」のみ）。「両方」ではなく37条のみ。引渡しの時期・移転登記の申請時期も同様に37条のみ＝最頻出ひっかけ。' },
  { id:'gyo-37-04', subject:'宅建業法', topic:'35条vs37条(契約書面)', law:'宅建業法', source:'宅建業法37条3項',
    q:'宅地建物取引業者は、37条書面を交付するときは、宅地建物取引士をして、その記載内容を説明させなければならない。',
    answer:false,
    explain:'誤り。37条には説明義務の規定がない。37条3項が宅建士に求めるのは書面への「記名」のみ。内容の説明（宅建士の独占業務）は35条の重要事項説明に限られる。「37条書面も宅建士が説明」は典型的な誤り肢。' },
  { id:'gyo-37-05', subject:'宅建業法', topic:'35条vs37条(既存建物)', law:'宅建業法', source:'宅建業法35条1項6の2号・37条1項2の2号',
    q:'既存の建物の売買では、建物状況調査を実施しているか等は35条書面に、当事者双方が構造耐力上主要な部分等の状況について確認した事項は37条書面に、それぞれ記載する。同じ既存建物でも両書面で記載内容が異なる。',
    answer:true,
    explain:'正しい。35条1項6の2号＝建物状況調査の「実施の有無・結果の概要」（契約前の判断材料）。37条1項2の2号＝既存建物のとき当事者双方が「確認した構造耐力上主要な部分等の状況」（合意した契約内容の記録）。同じ既存建物についての事項でも、35条＝調査の有無、37条＝双方確認事項と別物が別書面に載る＝頻出ひっかけ。' },
  { id:'gyo-38-01', subject:'宅建業法', topic:'8種制限(38条)', law:'宅建業法', source:'宅建業法38条1項',
    q:'宅地建物取引業者が自ら売主となる売買で、損害賠償額の予定も違約金も定めなかった場合、買主の債務不履行による業者の実損害が代金の10分の2を超えても、業者が請求できる損害賠償は代金の10分の2が上限となる。',
    answer:false,
    explain:'誤り。38条は損害賠償額の「予定・違約金を定めたとき」に合算額を代金の10分の2までに制限する規定。予定も違約金も定めなければ38条の射程外で、民法の原則（415・416条）により実損害を立証すれば10分の2を超えても全額請求できる。38条は「予定額」の上限であって「実際に支払われる損害賠償額」の上限ではない＝最大のひっかけ。' },
  { id:'gyo-39-01', subject:'宅建業法', topic:'8種制限(39条)', law:'宅建業法', source:'宅建業法39条2項',
    q:'宅地建物取引業者が自ら売主となる売買で、買主が中間金を支払った後であっても、売主である業者がまだ履行に着手していなければ、買主は手付を放棄して契約を解除することができる。',
    answer:true,
    explain:'正しい。39条2項ただし書が解除を妨げるのは「その相手方が」履行に着手した後。買主自身が中間金支払いで着手していても、相手方である業者が未着手なら、買主は手付放棄で解除できる。「自分が着手したら解除できない」は誤り＝着手保護は着手した側の不測損害を防ぐ趣旨で、着手したのが自分なら相手に保護すべき期待がない。' },
  { id:'gyo-40-01', subject:'宅建業法', topic:'8種制限(40条)', law:'宅建業法', source:'宅建業法40条・民法566条',
    q:'宅地建物取引業者が自ら売主となる売買で、種類・品質の契約不適合責任について「目的物の引渡しの日から1年間に通知したものに限り責任を負う」とする特約は有効である。',
    answer:false,
    explain:'誤り。40条は、民法566条（買主が不適合を知った時から1年以内に通知）より買主に不利な特約を禁止し、例外として「引渡しの日から2年以上」とする特約のみ許す。「引渡しから1年」は2年未満で買主に不利なので無効。無効になると民法566条の原則（知った時から1年）に戻る。' },
  { id:'gyo-41-01', subject:'宅建業法', topic:'8種制限(41条の2 手付金等の保全)', law:'宅建業法', source:'宅建業法41条の2第1項',
    q:'宅地建物取引業者が自ら売主となる工事完了後（完成物件）の売買で、買主から受領しようとする手付金等が代金の額の12%（政令で定める額は超えない）である場合、業者はそのうち代金の10%を超える部分についてのみ保全措置を講じればよい。',
    answer:false,
    explain:'誤り。完成物件は手付金等が代金の10%以下かつ政令で定める額以下なら保全不要だが、これを超えると「受領しようとする手付金等の全額」について保全措置が必要（41条の2第2項・3項。41条2項も同旨）。10%は保全要否の閾値にすぎず、超過分だけの保全では足りない。なお保全措置を講じないと買主は手付金等の支払を拒める（41条の2第5項）。' },
  { id:'gyo-41-02', subject:'宅建業法', topic:'8種制限(41条 未完成物件の手付金等保全)', law:'宅建業法', source:'宅建業法41条',
    q:'宅地建物取引業者が自ら売主となる工事完了前（未完成物件）の建物の売買で、手付金の額が代金の8%（政令で定める額は超えない）である場合、手付金等の保全措置を講じる必要はない。',
    answer:false,
    explain:'誤り。工事完了前（未完成物件）の保全基準は41条で「代金の5%以下かつ政令で定める額（1,000万円）以下」。8%は5%を超えるので保全措置が必要。完成物件（41条の2）の10%基準と混同しないこと（未完成5%／完成10%）。' },
  { id:'gyo-43-01', subject:'宅建業法', topic:'8種制限(43条 所有権留保等の禁止)', law:'宅建業法', source:'宅建業法43条1項',
    q:'宅地建物取引業者が自ら売主として行う割賦販売で、物件を買主に引き渡した後は、代金の受領額にかかわらず、直ちに所有権移転登記をしなければならない。',
    answer:false,
    explain:'誤り。43条1項は、引渡しまで（引渡しの時に代金の10分の3を超える額を受領していない場合は、10分の3を超える額を受領するまで）に登記その他引渡し以外の売主の義務を履行すればよいとする。引渡し後でも代金の3/10を超えるまでは所有権を留保できる。基準は「3/10（十分の三）」であって、手付・損害賠償予定の「2/10」ではない。' },
  { id:'gyo-37_2-01', subject:'宅建業法', topic:'8種制限(37条の2 クーリング・オフ)', law:'宅建業法', source:'宅建業法37条の2第1項',
    q:'宅地建物取引業者が自ら売主となる売買で、買主が業者の事務所で買受けの申込みをした場合、業者はクーリング・オフについて書面で告げなければならない。',
    answer:false,
    explain:'誤り。37条の2のクーリング・オフは「事務所等以外の場所」での申込みが対象。事務所で申込みをした場合はクーリング・オフの適用がなく、告知も不要。契約の場所ではなく「申込みの場所」で判断する。' },
  // ---- 権利関係 ----
  { id:'ken-94-01', subject:'権利関係', topic:'虚偽表示の第三者保護(94条2項)', law:'民法', source:'民法94条2項',
    q:'通謀虚偽表示の無効は、善意かつ無過失の第三者に対してのみ対抗できず、善意でも過失のある第三者には無効を対抗できる。',
    answer:false,
    explain:'誤り。94条2項は「善意の第三者」に対抗できないと定めるだけで、無過失は要件でない。善意であれば過失があっても保護される（心裡留保93条2項も同じ善意のみ）。錯誤95条4項・詐欺96条3項は善意無過失が必要で、この差が頻出（虚偽表示・心裡留保は表意者の帰責性が大きく第三者保護が厚い）。' },
  { id:'ken-95-01', subject:'権利関係', topic:'錯誤と重過失(95条3項)', law:'民法', source:'民法95条3項',
    q:'錯誤による意思表示は、表意者に重大な過失があるときは、いかなる場合も取り消すことができない。',
    answer:false,
    explain:'誤り。95条3項は重過失があると原則取消不可だが、例外が2つ：①相手方が表意者の錯誤を知り又は重過失で知らなかったとき、②相手方が同一の錯誤に陥っていたとき（共通錯誤）。「いかなる場合も」は誤り。' },
  { id:'ken-107-01', subject:'権利関係', topic:'代理権の濫用(107条)', law:'民法', source:'民法107条',
    q:'代理人が自己の利益を図る目的で代理権の範囲内の行為をした場合、相手方がその目的について善意無過失であっても、その行為は無権代理とみなされる。',
    answer:false,
    explain:'誤り。107条は「相手方がその目的を知り、又は知ることができたとき」に限り無権代理とみなす。相手方が善意無過失なら107条は発動せず、契約は有効に本人へ帰属する。' },
  { id:'ken-111-01', subject:'権利関係', topic:'代理権の消滅事由(111条)', law:'民法', source:'民法111条1項',
    q:'本人が後見開始の審判を受けたときは、代理人の代理権は消滅する。',
    answer:false,
    explain:'誤り。111条1項が定める本人側の消滅事由は「死亡」のみで、本人の後見開始は消滅事由でない。委任終了事由(653条)にも委任者の後見開始はない（3号は受任者の後見開始のみ）。代理人側の後見開始なら消滅する(1項2号)。' },
  { id:'ken-162-01', subject:'権利関係', topic:'取得時効(162条)', law:'民法', source:'民法162条2項',
    q:'所有の意思をもって平穏かつ公然と他人の物を10年間占有した者は、占有開始の時に善意かつ無過失であれば、その所有権を取得する。',
    answer:true,
    explain:'正しい。162条2項。善意無過失なら10年、悪意または有過失なら20年（1項）。善意無過失の判定は「占有の開始の時」に行う。' },
  { id:'ken-166-01', subject:'権利関係', topic:'消滅時効(166条)', law:'民法', source:'民法166条1項',
    q:'債権は、債権者が権利を行使することができることを知った時から10年間行使しないときに、時効によって消滅する。',
    answer:false,
    explain:'誤り。166条1項は、主観的起算点（知った時）から5年、客観的起算点（行使できる時）から10年。「知った時から」は5年であり10年ではない。' },
  { id:'ken-177-01', subject:'権利関係', topic:'対抗要件(177条)', law:'民法', source:'民法177条',
    q:'不動産に関する物権の得喪及び変更は、登記をしなければ第三者に対抗することができない。',
    answer:true,
    explain:'正しい。177条。物権変動は意思表示で生じる(176条)が、第三者に対抗するには登記が必要。二重譲渡では先に登記した者が勝つ。' },
  { id:'ken-388-01', subject:'権利関係', topic:'法定地上権(388条 更地に設定後の築造)', law:'民法', source:'民法388条・389条',
    q:'更地に抵当権を設定した後、抵当権設定者がその土地上に建物を築造し、土地の抵当権の実行により土地と建物の所有者が異なるに至った場合、その建物のために法定地上権が成立する。',
    answer:false,
    explain:'誤り。388条は「土地及びその上に存する建物が同一の所有者に属する場合」＝抵当権設定時に建物が存在することが要件。更地に設定した時点では建物がないため法定地上権は成立しない（抵当権者は更地の担保価値を評価している）。代わりに389条で土地とともに建物を一括競売できる（ただし優先権は土地の代価のみ）。' },
  { id:'ken-388-02', subject:'権利関係', topic:'法定地上権(388条 一方のみ抵当でも成立)', law:'民法', source:'民法388条',
    q:'土地とその上の建物をいずれも所有するAが建物のみに抵当権を設定し、その実行により建物の所有者がB・土地の所有者がAのままとなった場合、法定地上権は成立しない。',
    answer:false,
    explain:'誤り。法定地上権は土地・建物の一方のみに抵当権を設定した場合でも成立する。設定時に建物存在・同一所有(ともにA)、実行により建物Bと土地Aで所有者が異なるに至った＝4要件を満たす。建物所有者Bには敷地利用権がないため法定地上権で保護する。' },
  { id:'ken-377-01', subject:'権利関係', topic:'抵当権の処分の対抗要件(377条)', law:'民法', source:'民法377条1項・376条2項',
    q:'抵当権の処分（376条）を主たる債務者・保証人等に対抗するには、抵当権の付記登記を備えれば足りる。',
    answer:false,
    explain:'誤り。376条の処分の対抗要件は467条を準用した「主たる債務者への通知又は主たる債務者の承諾」（377条1項）。付記登記ではない。376条2項の付記登記は“受益者どうしの順位”を決めるもので、債務者等への対抗要件とは別。' },
  { id:'ken-392-01', subject:'権利関係', topic:'共同抵当の異時配当と代位(392条2項)', law:'民法', source:'民法392条2項',
    q:'同一債権の担保として甲・乙の不動産に共同抵当が設定され、先に甲のみが競売されて抵当権者が全額の弁済を受けた場合、甲の後順位抵当権者は、その抵当権者が乙から弁済を受けるべきであった金額を限度として、乙の抵当権に代位できる。',
    answer:true,
    explain:'正しい。392条2項の異時配当の代位。先に競売された甲の後順位抵当権者は、同時配当なら乙が負担したはずの金額を限度に、1番抵当権者が持っていた乙の抵当権に代位できる（同時配当と同じ結果に調整）。' },
  { id:'ken-shakuchi-01', subject:'権利関係', topic:'借地権の対抗力(借地借家法10条)', law:'借地借家法', source:'借地借家法10条1項・最判昭50.2.13・最大判昭41.4.27',
    q:'借地権は、その登記がなくても、借地上に借地権者が登記した建物を所有すれば第三者に対抗できるが、この建物の登記は所有権保存登記でなければならず、表示登記（表題部の登記）では対抗力が認められない。',
    answer:false,
    explain:'誤り。10条1項の建物登記は、借地権者本人の名義であれば、所有権保存登記でも表示登記（表題部の登記）でもよい（最判昭50.2.13）。表示登記でも対抗力が認められる。ただし借地人以外の名義（同居の子・家族名義を含む）ではダメ＝対抗力なし（最大判昭41.4.27）。要件は「登記名義人＝借地権者本人」であって、登記の種類（保存/表示）は問わない。' },
  { id:'ken-shakuchi-02', subject:'権利関係', topic:'一般定期借地権の存続期間(借地借家法22条)', law:'借地借家法', source:'借地借家法22条・23条',
    q:'一般定期借地権（借地借家法22条）は、存続期間を30年以上として設定し、かつその設定は公正証書によってしなければならない。',
    answer:false,
    explain:'誤り。一般定期借地権は存続期間を50年以上として設定する（22条）。また方式は「公正証書による等書面」＝公正証書に限らず書面（電磁的記録を含む）で足りる。公正証書が必須なのは事業用定期借地権（23条・存続期間10年以上50年未満）。数字は22条=50年以上／23条=10〜50年未満／24条(建物譲渡特約付)=30年以上。' },
  { id:'ken-shakuchi-03', subject:'権利関係', topic:'建物譲渡特約付借地権の存続期間・方式(借地借家法24条)', law:'借地借家法', source:'借地借家法24条1項',
    q:'建物譲渡特約付借地権（借地借家法24条）は、存続期間を30年以上として設定するもので、その特約は書面によることを要しない。',
    answer:true,
    explain:'正しい。24条は「その設定後三十年以上を経過した日に…建物を借地権設定者に相当の対価で譲渡する旨を定めることができる」＝存続期間30年以上。方式について書面の要求はなく口頭でも可。定期借地3類型の対比：一般(22条)=50年以上・公正証書等の書面／事業用(23条)=10〜50年未満・公正証書必須／建物譲渡特約付(24条)=30年以上・方式自由。下限の数字は50／10-50未満／30。' },
  { id:'ken-shakuchi-04', subject:'権利関係', topic:'事業用定期借地権の2つの期間帯(借地借家法23条2項)', law:'借地借家法', source:'借地借家法23条2項・3項',
    q:'専ら工場の用に供する建物の所有を目的として、存続期間を15年と定めて借地権を設定する場合、契約の更新がない旨を公正証書で定めても、その定めは無効である。',
    answer:false,
    explain:'誤り。23条は2つの期間帯に分かれる。1項＝30年以上50年未満（更新等がない旨を「定めることができる」＝特約型）、2項＝10年以上30年未満（「第三条から第八条まで、第十三条及び第十八条の規定は、適用しない」＝適用除外型で、更新の規定自体が働かない）。15年は2項に当たり、3項により公正証書で契約すれば有効。「事業用＝30年以上50年未満」の1本だけで覚えると15年を範囲外と誤判定する。' },
  { id:'ken-shakuchi-05', subject:'権利関係', topic:'50年ちょうどは22条か23条か(方式の違い)', law:'借地借家法', source:'借地借家法22条・23条1項・3項',
    q:'専ら事業の用に供する建物の所有を目的として存続期間を50年と定める場合、契約の更新がない旨の特約は、公正証書によらなければ効力を生じない。',
    answer:false,
    explain:'誤り。23条1項は「三十年以上五十年未満」なので、50年ちょうどは事業用でも23条1項に入らない。一方22条は「存続期間を五十年以上」とするだけで用途を限定していないため22条に乗る。22条後段の方式は「公正証書による等書面によって」＝公正証書は例示で、書面（2項により電磁的記録も可）で足りる。公正証書必須は23条3項（同条1項・2項の事業用）だけ。50年は22条と23条1項の境界。' },
  { id:'ken-572-01', subject:'権利関係', topic:'担保責任の免責特約と期間制限(売主が知りながら告げなかった場合)', law:'民法', source:'民法572条・566条ただし書・166条1項1号',
    q:'事業者ではないAが所有し居住していた建物をBに売却するに当たり、AB間で「Aは引渡しから3か月に限り担保責任を負う」旨の特約を付けた。Aは契約締結時点で建物の構造耐力上主要な部分に契約不適合があることを知っていたがBに告げず、Bはそれを知らなかった。Bは引渡しから3か月を経過した後にその契約不適合を知った場合、Aに対して担保責任を追及することはできない。',
    answer:false,
    explain:'誤り。売主が知りながら告げなかったときは、特約と期間制限の両方が同時に落ちる。①572条＝「担保の責任を負わない旨の特約をしたときであっても、知りながら告げなかった事実…については、その責任を免れることができない」→3か月の特約はこの不適合について働かない（「3か月に限り負う」という期間制限特約も、期間経過後は負わないのと同じなので本条の射程に入ると読む＝この点は条文に明記なし）。②566条本文の「不適合を知った時から1年以内の通知」も、ただし書「売主が引渡しの時にその不適合を知り、又は重大な過失によって知らなかったときは、この限りでない」で外れる。残るのは166条1項1号の消滅時効＝知った時から5年。なお566条の起算点は「引渡し」でなく「不適合を知った時」なので、引渡しから何か月経過したかは結論に影響しない。売主が事業者でないので宅建業法40条は働かず、民法だけで処理する。令和元年問3。' },
  { id:'ken-648-01', subject:'権利関係', topic:'委任の中途終了と割合報酬(民法648条3項2号)', law:'民法', source:'民法648条3項・536条2項',
    q:'AがBに対し報酬を支払う約束で自己所有のアパートの管理事務を委託し、Bが承諾した。その後、Bが自らの過失により管理事務を継続できなくなり、委任契約は履行の中途で終了した。この場合、終了の原因がBの責めに帰すべき事由である以上、Bは既にした履行の割合に応じた報酬をAに請求することはできない。',
    answer:false,
    explain:'誤り。648条3項2号は「委任が履行の中途で終了したとき」とだけ定めており、誰の責めに帰すべき事由で終了したかを問う文言がない。よってBの過失で終了した場合でも、Bは既にした履行の割合に応じて報酬を請求できる。同項1号（委任者の責めに帰することができない事由によって履行をすることができなくなったとき）とは別の号であり、1号の限定を2号に持ち込まない。誤り肢の型＝条文にない要件を1つ足す。※逆に委任者Aの帰責事由で終了した場合は、1号が「委任者の責めに帰することができない事由」と限定している以上その射程外となり、536条2項により報酬全額を請求でき、Bは自己の債務を免れたことによって得た利益を償還する（令和2年問5肢1＝正解肢。ただし536条2項が3項2号に優先するという組み立ては条文に明記がなく推論）。' },
  { id:'ken-551-01', subject:'権利関係', topic:'負担付贈与と双務契約規定の準用(民法553条)', law:'民法', source:'民法551条2項・553条',
    q:'AがBに対し、A所有の甲建物を贈与するとともに、Bに一定の債務を負担させる旨の負担付贈与契約を書面で締結した。この場合、Bがその負担を履行しないときであっても、贈与は無償契約であるから、Aが債務不履行を理由として契約を解除することはできない。',
    answer:false,
    explain:'誤り。553条は「負担付贈与については、この節に定めるもののほか、その性質に反しない限り、双務契約に関する規定を準用する」と定めており、負担の不履行を理由とする解除は生じうる。551条2項が「その負担の限度において、売主と同じく担保の責任を負う」とするのと表裏で、負担の限度では有償・双務として扱われる。令和2年問9肢4。「〜することはできない」という全否定は反例1つで倒れる（失点の型⑦）。' },
  { id:'ken-644-01', subject:'権利関係', topic:'無償委任の注意義務(民法644条と659条の水準)', law:'民法', source:'民法644条・659条',
    q:'AがBに対し、報酬を支払わない約束で自己所有の建物の管理を委託し、Bが承諾した。この場合、Bは無報酬で引き受けているのであるから、自己の財産に対するのと同一の注意をもって管理事務を処理すれば足りる。',
    answer:false,
    explain:'誤り。644条は「受任者は、委任の本旨に従い、善良な管理者の注意をもって、委任事務を処理する義務を負う」と定めるだけで、報酬の有無による区別をしていない。無償委任でも善管注意義務。「自己の財産に対するのと同一の注意」は659条＝無報酬の受寄者の注意義務の水準であり、条文が明文で軽減している類型のもの。誤り肢の型＝隣接する別条文の水準にすり替える。令和2年問5肢2。' },
  { id:'ken-shakuya-01', subject:'権利関係', topic:'借家の更新(借地借家法26条)', law:'借地借家法', source:'借地借家法26条1項',
    q:'期間の定めのある建物賃貸借が法定更新された場合、更新後の契約は従前と同一の期間の定めのある契約となる。',
    answer:false,
    explain:'誤り。26条1項ただし書は「その期間は、定めがないものとする」。法定更新後は期間の定めのない建物賃貸借になる。借地の法定更新後が4条で20年/10年と期間が定まるのと異なる（頻出ひっかけ）。' },
  { id:'ken-shakuya-02', subject:'権利関係', topic:'借家の正当事由(借地借家法28条)', law:'借地借家法', source:'借地借家法28条',
    q:'建物の賃貸人による更新拒絶の通知は、賃貸人が立退料の支払を申し出れば、他の事情を考慮するまでもなく正当の事由があると認められる。',
    answer:false,
    explain:'誤り。28条。正当事由の骨格は賃貸人・賃借人（転借人を含む）双方が建物の使用を必要とする事情。立退料（財産上の給付の申出）は「のほか」以下の補完要素にすぎず、単独では正当事由を基礎づけられない。' },
  { id:'ken-shakuya-03', subject:'権利関係', topic:'造作買取請求権(借地借家法33条)', law:'借地借家法', source:'借地借家法33条・37条',
    q:'建物の賃貸借契約において、賃借人の造作買取請求権をあらかじめ排除する旨の特約は、借地借家法の強行規定に反し無効である。',
    answer:false,
    explain:'誤り。造作買取請求権(33条)は強行規定(37条＝31・34・35条のみ)に含まれない任意規定なので、排除特約は有効。借地13条の建物買取請求が強行規定で排除特約無効なのと対照的（最頻出の違い）。' },
  { id:'ken-shakuya-04', subject:'権利関係', topic:'定期借家(借地借家法38条)', law:'借地借家法', source:'借地借家法38条3項・5項',
    q:'定期建物賃貸借をしようとする賃貸人が、あらかじめ、更新がなく期間の満了により終了する旨を記載した書面を交付して説明しなかったときは、契約の更新がないこととする旨の定めは無効となる。',
    answer:true,
    explain:'正しい。38条5項。事前説明(3項)を怠ると「更新がない旨の定め」が無効となり、普通借家（更新あり・正当事由）になる。事前説明書面は1項の契約書面とは別個独立の書面が必要（判例 最判平24.9.13）。' },
  { id:'ken-shakuya-05', subject:'権利関係', topic:'借家の対抗力と抵当権の先後(借地借家法31条・民法395条)', law:'借地借家法', source:'借地借家法31条・民法395条',
    q:'建物の賃貸人が建物に抵当権を設定した後、その建物を賃借人に賃貸して引き渡した場合、賃借人は建物の引渡しを受けているので、抵当権実行による競落人に対して賃借権を対抗できる。',
    answer:false,
    explain:'×。31条の引渡しによる対抗力は「その後その建物について物権を取得した者」に対するもの。抵当権設定が引渡しより先なので、抵当権に基づく競落人には対抗できない（賃借人には民法395条の引渡し猶予6か月があるのみ）。引渡しが抵当権設定より前なら対抗できる＝時間の前後で決まる。' },
  { id:'ken-shakuya-06', subject:'権利関係', topic:'建物賃貸借の解約申入れの非対称(27条・民法617条)', law:'借地借家法', source:'借地借家法27条1項・民法617条1項2号',
    q:'期間の定めのない建物賃貸借において、賃借人の側から解約を申し入れた場合、解約申入れの日から6月を経過することによって賃貸借は終了する。',
    answer:false,
    explain:'×。賃借人からの解約は民法617条1項2号で3月（借地借家法に賃借人側の特則なし）。6月は賃貸人からの解約申入れの場合で、これには28条の正当事由も必要。解約期間の非対称（賃貸人6月／賃借人3月）に注意。' },
  { id:'ken-kyoyu-01', subject:'権利関係', topic:'共有物の変更・管理(251・252条)', law:'民法', source:'民法251条1項・252条1項',
    q:'共有物に変更を加える行為は、その形状又は効用の著しい変更を伴わないものであっても、常に共有者全員の同意がなければすることができない。',
    answer:false,
    explain:'誤り。2021年改正で、変更のうち「形状又は効用の著しい変更を伴わないもの（軽微変更）」は251条1項の変更から除外され、252条1項の管理として持分価格の過半数で決せられる（例：砂利道のアスファルト舗装）。全員同意が必要なのは重大変更（建替え・売却等）。' },
  { id:'ken-kyoyu-02', subject:'権利関係', topic:'裁判による共有物分割(258条)', law:'民法', source:'民法258条2項・3項',
    q:'裁判による共有物の分割において、裁判所は、現物分割や賠償分割によることができる場合であっても、共有者の一人の申立てがあれば競売による分割を命じなければならない。',
    answer:false,
    explain:'誤り。258条は①現物分割／②賠償分割（債務を負担させ他の持分を取得させる＝価格賠償）を原則とし（2項）、これらの方法で分割できないとき、又は分割により価格を著しく減少させるおそれがあるときに限り競売を命じうる（3項）。競売は補充的な最後の手段で、当然に命じられるものではない。' },
  { id:'ken-souzoku-01', subject:'権利関係', topic:'代襲相続(887・939条)', law:'民法', source:'民法887条2項・939条',
    q:'被相続人の子が相続を放棄した場合、その子（被相続人の孫）が放棄した者を代襲して相続人となる。',
    answer:false,
    explain:'誤り。代襲原因（887条2項）は「相続開始以前の死亡・欠格・廃除」で、放棄は含まれない。放棄者は「初めから相続人とならなかったものとみなす」（939条）ため、その子は代襲しない。死亡・欠格・廃除は代襲するが放棄は代襲しない、が頻出の対比。' },
  { id:'ken-iryubun-01', subject:'権利関係', topic:'遺留分(1042・1046条)', law:'民法', source:'民法1042条1項・1046条1項',
    q:'被相続人の兄弟姉妹は遺留分権利者であり、遺留分を侵害された場合は侵害額に相当する金銭の支払を請求できる。',
    answer:false,
    explain:'誤り。遺留分権利者は「兄弟姉妹以外の相続人」（1042条1項）＝配偶者・子・直系尊属で、兄弟姉妹に遺留分はない。なお2018年改正で権利は金銭債権化され、遺留分権利者は侵害額に相当する金銭の支払を請求する（1046条・旧減殺請求の物権的効果＝目的物の共有から転換）。' },
  { id:'ken-kubun-01', subject:'権利関係', topic:'区分所有法 決議の定数', law:'区分所有法', source:'区分所有法62条1項・31条1項',
    q:'区分所有建物の建替え決議は、区分所有者及び議決権の各4分の3以上の多数による集会の決議で行うことができる。',
    answer:false,
    explain:'誤り。建替え決議は各「5分の4以上」（62条1項）。各4分の3以上は規約の設定変更廃止(31条1項)・共用部分の重大変更(17条1項)等の特別決議の定数。普通決議は各過半数(39条1項)。' },
  { id:'ken-kubun-02', subject:'権利関係', topic:'区分所有法 特別決議の出席者ベース化(令和7年改正)', law:'区分所有法', source:'区分所有法31条1項(2026年4月1日施行)',
    q:'区分所有法（2026年4月1日施行の改正後）では、規約の変更は、区分所有者及び議決権の総数の各4分の3以上の賛成が必要で、集会を欠席した区分所有者も母数に含めて4分の3を計算する。',
    answer:false,
    explain:'×。令和7年改正（2026年4月1日施行）で特別決議は出席者ベースに変更。過半数の出席を定足数とし、出席した区分所有者及び議決権の各4分の3以上で決する（旧法の「総数の各4分の3」から変更）。欠席者は母数から外れる。' },
  { id:'ken-kubun-03', subject:'権利関係', topic:'区分所有法 バリアフリー化の変更は2/3(令和7年改正)', law:'区分所有法', source:'区分所有法17条5項(2026年4月1日施行・新設)',
    q:'共用部分の変更のうち、高齢者・障害者等のためのバリアフリー化に必要なものは、出席した区分所有者及び議決権の各3分の2以上の多数で決することができる。',
    answer:true,
    explain:'○。令和7年改正で新設された17条5項。共用部分の変更は原則「4分の3」だが、バリアフリー化や共用部分の設置・保存の瑕疵の除去に必要な変更は「3分の2」に引き下げて決議できる。' },
  { id:'ken-fuho-01', subject:'権利関係', topic:'工作物責任(717条)', law:'民法', source:'民法717条1項',
    q:'土地の工作物の設置の瑕疵で他人に損害が生じた場合、その工作物の所有者は、損害の発生の防止に必要な注意をしていたことを証明すれば、損害賠償責任を免れる。',
    answer:false,
    explain:'誤り。717条1項で第一次的に責任を負うのは占有者で、占有者は必要な注意をしたことを立証すれば免責される（中間責任）。占有者が免責されたとき責任を負う所有者には免責規定がなく、無過失でも責任を負う（無過失責任・最後の砦）。' },
  // ---- 法令制限 ----
  { id:'hou-nochi-01', subject:'法令制限', topic:'農地法3条', law:'農地法', source:'農地法3条1項',
    q:'農地について所有権を移転する場合（農地法3条の権利移動）の許可権者は、原則として都道府県知事である。',
    answer:false,
    explain:'誤り。3条1項の許可権者は農業委員会。都道府県知事等の許可は転用(4条)・転用目的権利移動(5条)。3条＝農業委員会／4・5条＝知事等、で区別する。' },
  { id:'hou-nochi-02', subject:'法令制限', topic:'農地法3条', law:'農地法', source:'農地法3条6項',
    q:'農地法3条の許可を受けないでした農地の権利移動は、その効力を生じない。',
    answer:true,
    explain:'正しい。3条6項「第一項の許可を受けないでした行為は、その効力を生じない」。5条違反も3条6項準用で無効。4条違反は無効ではなく51条の措置命令。' },
  { id:'hou-kenchiku-01', subject:'法令制限', topic:'接道義務(建基法43条)', law:'建築基準法', source:'建築基準法43条1項',
    q:'建築物の敷地は、道路に2メートル以上接しなければならない。',
    answer:true,
    explain:'正しい。43条1項。避難・緊急車両アクセス確保が趣旨。自動車専用道路等は除外され、条例でさらに付加(3項)できる。' },
  { id:'hou-kokudo-01', subject:'法令制限', topic:'国土利用計画法 事後届出(23条)', law:'国土利用計画法', source:'国土利用計画法23条1項・2項1号',
    q:'市街化区域内において3,000㎡の土地の売買契約を締結した買主は、その契約を締結した日から起算して2週間以内に事後届出をしなければならない。',
    answer:true,
    explain:'正しい。23条2項1号イ＝市街化区域は2,000㎡以上で届出必要（3,000㎡は該当）。届出義務者は権利取得者（買主）、期間は契約締結日から2週間以内、土地所在の市町村長を経由して都道府県知事へ。' },
  { id:'hou-kokudo-02', subject:'法令制限', topic:'国土利用計画法 事後届出(23条)', law:'国土利用計画法', source:'国土利用計画法23条・47条',
    q:'事後届出をすべき土地売買契約について届出を怠った場合、その契約は無効となる。',
    answer:false,
    explain:'誤り。事後届出制は届出制であって許可制ではないため、無届出でも契約は有効。ただし47条1項で6月以下の拘禁刑又は100万円以下の罰金。規制区域の許可制(14条)で無許可契約が無効となるのと区別する。' },
  { id:'hou-kokudo-03', subject:'法令制限', topic:'国土利用計画法 勧告(24条)', law:'国土利用計画法', source:'国土利用計画法24条',
    q:'事後届出があった場合、都道府県知事は、土地の利用目的のほか、予定対価の額についても変更を勧告することができる。',
    answer:false,
    explain:'誤り。24条の勧告対象は「利用目的」のみで、対価の額（価格）は勧告できない。事後届出制は価格を審査しない（価格審査は事前届出制＝注視・監視区域の役割）。勧告は届出日から3週間以内。' },
  { id:'hou-kokudo-04', subject:'法令制限', topic:'国土利用計画法 事前届出(注視区域)', law:'国土利用計画法', source:'国土利用計画法27条の4',
    q:'注視区域内の土地について土地売買等の契約を締結しようとする場合、当事者の双方が、契約締結前にあらかじめ届け出なければならない。',
    answer:true,
    explain:'正しい。注視区域は事前届出制（27条の4）＝両当事者が契約締結前に届出。届出日から6週間は契約締結禁止。事後届出（23条＝権利取得者のみ・契約後2週間以内・価格審査なし）と区別する。' },
  { id:'hou-kokudo-05', subject:'法令制限', topic:'国土利用計画法 対価性(贈与は対象外)', law:'国土利用計画法', source:'国土利用計画法23条1項・14条1項',
    q:'市街化区域内にある3,000㎡の土地を贈与により取得した場合、面積要件（2,000㎡以上）を満たすので、事後届出をしなければならない。',
    answer:false,
    explain:'誤り。事後届出の対象は「土地売買等の契約」＝「対価を得て行われる」権利の移転又は設定（予約を含む）に限られる。贈与は無償＝対価がないので、面積要件を満たしても届出不要。判断基準は「意思をもって取得したか」ではなく「対価があるか」。対象外の3軸＝①契約でない（相続・時効取得・収用）②無償（贈与・使用貸借）③使用収益目的の権利でない（抵当権・質権）。交換は対価があるので対象。' },
  { id:'hou-kokudo-06', subject:'法令制限', topic:'国土利用計画法 面積要件の区分(5,000と10,000)', law:'国土利用計画法', source:'国土利用計画法23条2項1号',
    q:'市街化調整区域内にある4,000㎡の土地を売買により取得した場合、事後届出をしなければならない。',
    answer:false,
    explain:'誤り。市街化調整区域は「市街化区域を除く都市計画区域」＝5,000㎡以上で届出必要。4,000㎡は5,000㎡未満なので届出不要。10,000㎡は都市計画区域外の基準であり、市街化調整区域の基準ではない（5,000と10,000の取り違えが頻出）。面積：市街化区域2,000／市街化区域を除く都市計画区域5,000／都市計画区域外10,000。' },
  { id:'hou-kokudo-07', subject:'法令制限', topic:'国土利用計画法 事後届出の届出先(市町村長を経由)', law:'国土利用計画法', source:'国土利用計画法23条1項',
    q:'事後届出は、土地売買等の契約を締結した日から起算して2週間以内に、権利取得者が都道府県知事に対して直接行わなければならない。',
    answer:false,
    explain:'誤り。23条1項は「その契約を締結した日から起算して二週間以内に、…当該土地が所在する市町村の長を経由して、都道府県知事に届け出なければならない」と定める。届出先は都道府県知事だが、経路は市町村長の経由が必要で「直接」ではない。届出義務者が権利取得者のみ・2週間以内である点は正しいので、経由の一語だけを差し替えるひっかけになりやすい。' },
  { id:'hou-kokudo-08', subject:'法令制限', topic:'国土利用計画法 勧告の対象(利用目的のみ・対価は対象外)', law:'国土利用計画法', source:'国土利用計画法24条1項・23条1項6号',
    q:'都道府県知事は、事後届出に係る土地について、その利用目的だけでなく対価の額についても、必要な変更をすべきことを勧告することができる。',
    answer:false,
    explain:'誤り。24条1項の勧告対象は「その届出に係る土地の利用目的について必要な変更をすべきこと」のみで、対価の額は勧告できない。対価の額は23条1項6号で「届出事項」には含まれるため、「届出させるなら勧告もできる」と繋げると誤る（届出事項≠勧告対象）。事後届出制は価格規制でなく利用目的の規制。価格が勧告対象になるのは事前届出（注視区域27条の5）の方。勧告は届出日から3週間以内（24条2項）、従わなくても罰則はなく公表のみ（26条）。' },
  { id:'hou-morido-01', subject:'法令制限', topic:'盛土規制法 許可が必要な規模', law:'盛土規制法', source:'盛土規制法施行令3条1号・2号',
    q:'宅地造成等工事規制区域内で、盛土により高さ1.5メートルの崖を生じる工事と、切土により高さ1.5メートルの崖を生じる工事は、いずれも都道府県知事の許可が必要である。',
    answer:false,
    explain:'誤り。施行令3条で、崖を生じる場合の規模は盛土＝高さ「1m超」（1号）、切土＝高さ「2m超」（2号）。盛土1.5mは1m超なので許可必要だが、切土1.5mは2m以下なので（この号では）許可不要。盛土は人工的な土で崩れやすく不安定なため基準が厳しい（1m）。盛土と切土の数値の違いが頻出ひっかけ。' },
  { id:'hou-morido-02', subject:'法令制限', topic:'盛土規制法 開発許可みなし', law:'盛土規制法', source:'盛土規制法15条2項',
    q:'宅地造成等工事規制区域内の宅地造成について、都市計画法29条の開発許可を受けた場合であっても、別途、盛土規制法に基づく都道府県知事の許可を受けなければならない。',
    answer:false,
    explain:'誤り。15条2項により、規制区域の指定後に都市計画法29条の開発許可を受けたときは、盛土規制法12条の許可を受けたものとみなされる（二重規制の回避）。「開発許可と盛土規制法の許可の両方が必要」は誤り肢。' },
  { id:'hou-morido-03', subject:'法令制限', topic:'盛土規制法 届出の事前/事後', law:'盛土規制法', source:'盛土規制法21条3項・21条4項',
    q:'宅地造成等工事規制区域内において、政令で定める擁壁の除却工事を行おうとする者は、その工事に着手した日から14日以内に、その旨を都道府県知事に届け出なければならない。',
    answer:false,
    explain:'誤り。21条3項で、擁壁等の除却など政令で定める工事の届出は「着手する日の14日前まで」の事前届出。「着手した日から14日以内」は事後にすり替えたひっかけ。14日は事前（21条3項・擁壁除却）にも事後（21条4項・公共施設用地の転用＝転用日から14日以内）にも出るので、数字でなく「これからやる工事＝事前／もう起きたこと＝事後」で判断する。事後届出は〈区域指定に既着手＝21日以内〉と〈転用済み＝14日以内〉の2つだけ。' },
  { id:'hou-morido-04', subject:'法令制限', topic:'盛土規制法 公共施設用地の転用は許可か届出か', law:'盛土規制法', source:'盛土規制法21条4項・12条1項',
    q:'宅地造成等工事規制区域内において、Aは自己が所有する公共施設用地（道路として使用されていた土地）を宅地に転用した。転用に当たって盛土その他の土地の形質の変更に関する工事は一切行っていない。この場合、Aは都道府県知事の許可を受けなければならない。',
    answer:false,
    explain:'誤り。21条4項＝「宅地造成等工事規制区域内において、公共施設用地を宅地又は農地等に転用した者（12条1項若しくは16条1項の許可を受け、又は同条2項の届出をした者を除く。）は、その転用した日から14日以内に…その旨を都道府県知事に届け出なければならない」。つまり工事を伴わない転用は【許可でなく事後の届出（14日以内）】。工事を行うなら12条1項の許可の対象になるので、21条4項は括弧書きでその者を除いている。誤り肢の型＝届出で足りるものを許可にすり替える。令和2年問19肢3。' },
  { id:'hou-morido-05', subject:'法令制限', topic:'盛土規制法 宅地造成の定義（方向の非対称）', law:'盛土規制法', source:'盛土規制法2条2号・2条1号',
    q:'宅地造成等工事規制区域内で、Aが自己所有の宅地を農地にするために行う土地の形質の変更は、規模の大小にかかわらず「宅地造成」に当たらない。',
    answer:true,
    explain:'正しい。2条2号＝「宅地造成とは、宅地以外の土地を宅地にするために行う盛土その他の土地の形質の変更で政令で定めるものをいう」。定義は【宅地以外→宅地】の一方向だけを捉えており、【宅地→宅地以外】は宅地造成に当たらない（2条1号で「宅地」は農地等・公共施設用地以外の土地と定義されているので、宅地を農地にする行為は逆方向）。農地法4条1項本文が「農地を農地以外のものにする者」と一方向だけを規制するのと同じ非対称の型。ただし宅地・農地等で行う盛土等は要件を満たせば2条3号の「特定盛土等」として別途規制されうる点は区別する。令和2年問19肢2。' },
  { id:'hou-bouka-01', subject:'法令制限', topic:'防火・準防火地域 内外にわたる場合', law:'建築基準法', source:'建築基準法65条2項',
    q:'1棟の建物が防火地域と準防火地域にわたる場合、防火壁で区画されていないときは、その建物全部について準防火地域内の建築物に関する規定が適用される。',
    answer:false,
    explain:'誤り。65条2項。建築物が防火地域と準防火地域にわたる場合は、その全部について厳しい方の「防火地域」内の建築物に関する規定を適用する（防火壁で区画された部分を除く）。緩い準防火を全部に適用するのではない。' },
  // ---- 税・その他 ----
  { id:'ze-koteishisan-01', subject:'税・その他', topic:'固定資産税', law:'地方税法', source:'地方税法350条',
    q:'固定資産税の標準税率は1.4%である。',
    answer:true,
    explain:'正しい。地方税法350条。1.4%は標準税率（通常用いる税率）。固定資産税は市町村税で、賦課期日（1月1日）に固定資産課税台帳に登録された所有者に課税する。' },
  { id:'ze-fudosan-01', subject:'税・その他', topic:'不動産取得税', law:'地方税法', source:'地方税法（不動産取得税）',
    q:'不動産取得税は、不動産の所在する市町村が課税する税である。',
    answer:false,
    explain:'誤り。不動産取得税は都道府県が課する税（都道府県税）。市町村が課すのは固定資産税。課税主体の取り違えは頻出ひっかけ。' },
  { id:'ze-inshi-01', subject:'税・その他', topic:'印紙税 課税文書', law:'印紙税法', source:'印紙税法別表第一',
    q:'建物の賃貸借契約書および宅地建物取引業者が作成する媒介契約書は、いずれも印紙税の課税文書ではない。',
    answer:true,
    explain:'正しい。印紙税の課税文書は別表第一の限定列挙で、建物の賃貸借契約書・媒介契約書は列挙にないため不課税。ただし土地の賃貸借契約書（権利金等の記載があるもの）は第1号文書で課税となる点に注意（土地と建物で扱いが違う）。' },
  { id:'ze-shutoku-01', subject:'税・その他', topic:'不動産取得税の徴収', law:'地方税法', source:'地方税法73条の17',
    q:'不動産取得税は、納税者が課税標準額及び税額を申告して納付する申告納付の方法により徴収される。',
    answer:false,
    explain:'誤り。73条の17第1項は「普通徴収の方法によらなければならない」と定める。普通徴収＝行政が税額を計算し納税通知書を交付して課す方式（賦課課税）であり、申告納付ではない。なお73条の18の申告・報告義務は賦課のための情報提供で、登記を申請すれば不要。' },
  { id:'ze-kotei-menzei-01', subject:'税・その他', topic:'固定資産税の免税点', law:'地方税法', source:'地方税法351条',
    q:'同一市町村内に同一人が土地を3筆所有し、各筆の課税標準額がいずれも15万円である場合、すべて30万円未満なので固定資産税は課されない。',
    answer:false,
    explain:'誤り。351条は「同一の者について当該市町村の区域内における」土地の課税標準額で判定するので、3筆を合算した45万円が免税点30万円以上となり課税される。筆ごとに刻んで免税点を下回らせることはできない。' },
  { id:'ze-31_3-01', subject:'税・その他', topic:'居住用財産の軽減税率(措法31条の3 所有期間)', law:'租税特別措置法', source:'租税特別措置法31条の3第1項',
    q:'居住用財産の譲渡所得の軽減税率の特例は、譲渡した年の1月1日において所有期間が5年を超えていれば適用を受けることができる。',
    answer:false,
    explain:'誤り。軽減税率の特例(31条の3)は1月1日において所有期間が「10年超」であることが要件。5年超は長期譲渡所得の区分(措法31条)の話で別物。長短区分＝5年／軽減税率＝10年の混同が最頻出ひっかけ。' },
  { id:'ze-31_3-02', subject:'税・その他', topic:'3000万円控除と軽減税率の併用(措法35・31条の3)', law:'租税特別措置法', source:'租税特別措置法31条の3第1項・35条',
    q:'居住用財産の3,000万円特別控除(措法35条)と居住用財産の軽減税率の特例(措法31条の3)は、要件を満たせば同一の譲渡について重ねて適用を受けることができる。',
    answer:true,
    explain:'正しい。まず35条で3,000万円を控除し、控除後の課税長期譲渡所得金額に31条の3の軽減税率(6000万円以下10%/超15%)を適用できる＝併用可。31条の3の除外列挙に35条本体は入っていない。一方、買換え特例(36条の2)とは併用不可。' },
  { id:'ze-31-01', subject:'税・その他', topic:'譲渡所得 長短区分の基準日(措法31条2項)', law:'租税特別措置法', source:'租税特別措置法31条2項',
    q:'土地建物等の譲渡所得の長期・短期の区分は、譲渡した日において所有期間が5年を超えるかどうかで判定する。',
    answer:false,
    explain:'誤り。長短区分は「譲渡した日」ではなく「譲渡した年の1月1日」において所有期間が5年を超えるかで判定する(措法31条2項)。取得日から譲渡日までの実期間でなく1月1日でカウントするのが最頻出ひっかけ。5年超＝長期(所得税15%)／5年以下＝短期(30%)。' },
  { id:'ze-touroku-01', subject:'税・その他', topic:'登録免許税 住宅用家屋の軽減(土地不適用)', law:'租税特別措置法', source:'租税特別措置法72条の2・73条',
    q:'住宅用家屋を売買により取得した個人が受ける所有権移転登記の税率軽減（0.3%）は、その敷地である土地の所有権移転登記についても同様に適用される。',
    answer:false,
    explain:'誤り。住宅用家屋の登録免許税の軽減（保存0.15%＝措法72の2／移転0.3%＝措法73／抵当0.1%＝措法75）はいずれも「家屋」が対象で、土地には及ばない。土地の売買移転登記は別系統（措法72条で本則2.0%→1.5%）。「家屋の軽減が土地にも及ぶ」は頻出ひっかけ。' },
  { id:'ze-inshi-kingaku-01', subject:'税・その他', topic:'印紙税 記載金額の計算(複数号・区分記載)', law:'印紙税法', source:'印紙税法別表第一 通則4',
    q:'一つの契約書に、第1号文書に当たる不動産の譲渡金額3,000万円と、第2号文書に当たる請負金額2,000万円とが区分して記載されている場合、その契約書の記載金額は合計の5,000万円となる。',
    answer:false,
    explain:'誤り。異なる二以上の号に該当し金額が区分記載されているときは、通則3で決まる「所属する号」の金額が記載金額（合計しない）。第1号と第2号の両方に該当する文書は原則第1号（請負＞譲渡なら第2号）。本問は譲渡3,000万＞請負2,000万で所属は第1号、記載金額は3,000万円。合計になるのは同一号どうしの金額のときだけ。' },
  { id:'ze-chika-01', subject:'税・その他', topic:'地価公示 正常な価格(更地評価)', law:'地価公示法', source:'地価公示法2条2項',
    q:'地価公示法の「正常な価格」とは、標準地に建物その他の定着物や、地上権等の使用収益を制限する権利が存する場合には、それらが存するものとして通常成立すると認められる価格をいう。',
    answer:false,
    explain:'誤り。2条2項。定着物や使用収益を制限する権利があっても、それらが「存しないものとして」＝更地・自由な状態で通常成立する価格を求める。実際に古家や借地権が付いていても、取り払った更地の価格を公示する。「存するものとして」と「存しないものとして」の反転が頻出ひっかけ。' },
  { id:'ze-kantei-01', subject:'税・その他', topic:'鑑定評価 特定価格と特殊価格の区別', law:'不動産鑑定評価基準', source:'不動産鑑定評価基準 総論5章',
    q:'特殊価格とは、市場性を有する不動産について、法令等による社会的要請を背景とする鑑定評価目的の下で求める価格をいう。',
    answer:false,
    explain:'誤り。これは特定価格（証券化・民事再生・会社更生等／市場性あり）の定義。特殊価格は、文化財・宗教建築物・公共公益施設など「一般に市場性を有しない不動産」について、その利用現況等を前提に求める価格。軸＝特定価格は市場性あり／特殊価格は市場性なし。' },
  { id:'ze-hyoji-01', subject:'税・その他', topic:'表示規約 増改築の表示は条件付き義務', law:'不動産の表示に関する公正競争規約', source:'表示規約施行規則9条1項21号',
    q:'増築、改築、改装又は改修した中古住宅については、その内容及び時期を必ず表示しなければならない。',
    answer:false,
    explain:'誤り。施行規則9条1項21号は「建物を増築、改築、改装又は改修したことを表示する場合は、その内容及び時期を明示すること」＝リフォームを広告で謳うなら内容と時期まで書け、という条件付きの義務。リフォームの事実を必ず広告に書けとは定めていない。「必ず」「常に」は主張を強める語なので、条文に条件が付いていればその時点で誤りになる（7/30に整理した留保句の型の裏面）。令和元年問47肢3。' },
  { id:'ze-toukei-01', subject:'税・その他', topic:'地価公示と都道府県地価調査の公表月・基準日', law:'地価公示法', source:'地価公示法2条1項・6条／地価公示法施行規則2条／国土利用計画法施行令9条・同施行規則14条／国土交通省報道発表',
    q:'地価公示は毎年1月1日を価格判定の基準日とし、3月に公表される。',
    answer:true,
    explain:'正しい。基準日1月1日は地価公示法施行規則2条に「法第二条第一項の標準地の価格判定の基準日は、一月一日とする」と明記されている（法2条1項自体は「毎年一回…一定の基準日における」としか定めず、日付は省令に落ちている）。一方3月公表は条文になく運用で、公表実績は令和8年＝3月18日、令和7年＝3月19日、平成31年＝3月20日。対になる都道府県地価調査も同じ構造で、基準日7月1日は国土利用計画法施行規則14条に明記・9月公表は運用（令和7年＝9月17日）。この2つの取り違えが統計問題の定番で、基準日は条文で潰せるが公表時期は公表実績に当たるしかない。' },
  { id:'ze-fudosan-02', subject:'税・その他', topic:'共有物の分割による取得は「持分の割合を超えない部分」だけ非課税(73条の7第2号の3)', law:'地方税法', source:'地方税法73条の7第2号の3',
    q:'ＡとＢが持分2分の1ずつで共有する土地を分割し、Ａが分割前の持分の割合を超える部分を取得した。この場合、共有物の分割による取得であるから、その超える部分についても不動産取得税は課されない。',
    answer:false,
    explain:'×。73条の7第2号の3は「共有物の分割による不動産の取得（当該不動産の取得者の分割前の当該共有物に係る持分の割合を超える部分の取得を除く。）」と定めており、非課税の範囲を括弧書きで限定している。持分割合を超える部分は実質的に新たな取得なので課税される。共有物分割が非課税とされるのは「形式的な所有権の移転」＝実質的な権利の移動がないからであり、持分を超えた部分にはその理由が当てはまらない。誤り肢の型＝括弧書きの限定を落として無条件の非課税に読み替える（2026-08-07 実物 令和2年 問24 肢4＝正解肢）。' },
  { id:'ze-kotei-02', subject:'税・その他', topic:'小規模住宅用地1/6と一般の住宅用地1/3の区分(349条の3の2)', law:'地方税法', source:'地方税法349条の3の2第1項・2項',
    q:'住宅1戸が建っている300㎡の住宅用地について、固定資産税の課税標準は、300㎡すべてについて価格の3分の1の額とされる。',
    answer:false,
    explain:'×。349条の3の2は2段構えで、1項が住宅用地一般に価格の3分の1、2項がそのうち小規模住宅用地（住居1戸あたり200㎡以下の部分）に価格の6分の1を重ねて上書きする。したがって300㎡のうち200㎡は6分の1、残り100㎡が3分の1。「300㎡すべてが3分の1」は小規模住宅用地の特例を落としている。1/3が同じ条文に実在する数字なので入れ替えても違和感が出にくいのが急所。なお2項2号により住居が複数あるときは200㎡×住居の数まで小規模扱いになる（10戸なら2,000㎡）。誤り肢の型＝数値の区分違い（2026-08-07 実物 令和元年 問24 肢2で失点）。' },
  { id:'ze-kikou-01', subject:'税・その他', topic:'機構が行う保険(13条1項3号)と団信(12号)の区別', law:'住宅金融支援機構法', source:'独立行政法人住宅金融支援機構法13条1項3号・12号',
    q:'独立行政法人住宅金融支援機構は、保険を引き受ける業務は行っておらず、団体信用生命保険に関する業務もその範囲に含まれない。',
    answer:false,
    explain:'×。二重に誤っている。第一に13条1項3号が「住宅融資保険法による保険を行うこと」と定めており、機構は保険者になる業務を現に行っている（13条2項1号・8号にも保険業務がある）。第二に、12号の団体信用生命保険は「保険金若しくは生命共済の共済金…を当該貸付けに係る債務の弁済に充当し」と定めるもので、機構が保険を引き受けるのではなく保険金を受け取って債務に充てる業務であり、これも機構の業務として明記されている。「保険はやらないはず」で切ると、やる方（3号）は実在し、切った方（12号）は保険業務ですらないという二重のずれになる。12号は〔一〜四＝民間の貸付けに乗る／五〜十一＝自ら貸す〕のどちらにも属さず、買い取った債権と自ら貸した債権の両方に後からかぶせる第3の軸（回収リスクの引受け）。（2026-08-07 実物 令和2年 問46 肢4で失点）' },
  { id:'gyo-36-01', subject:'宅建業法', topic:'契約締結時期の制限(36条)と広告(33条)の対比', law:'宅建業法', source:'宅建業法36条・33条',
    q:'宅地建物取引業者は、宅地の造成工事の完了前で必要な許可等を受ける前であっても、その宅地の貸借の媒介の契約を締結することはできるが、その貸借に関する広告をすることはできない。',
    answer:true,
    explain:'正しい。契約締結時期の制限（36条）の対象は「売買・交換」のみで貸借は対象外＝貸借の契約は締結できる。一方、広告開始時期の制限（33条）は「売買その他の業務に関する広告」で貸借の広告も含む＝できない。未完成物件で「貸借は広告NG・契約OK」と扱いが逆になるのが最頻出ひっかけ。令和元年問35肢4で出題。' },
  { id:'gyo-co-jimusho', subject:'宅建業法', topic:'クーリング・オフ 事務所等(他業者の事務所)', law:'宅建業法', source:'宅建業法37条の2・施行規則16条の5',
    q:'宅地建物取引業者Aが自ら売主となる宅地の売買について、Aが媒介を依頼した他の宅地建物取引業者Cの事務所で買受けの申込みをした買主は、クーリング・オフについて告げられていなくても、当該申込みを撤回することができる。',
    answer:false,
    explain:'誤り。代理・媒介の依頼を受けた他の宅建業者の事務所も「事務所等」に当たる（施行規則16条の5ハ）。事務所等でした申込みは、告知の有無や8日の経過に関係なく、そもそもクーリング・オフの対象外。令和元年問38ウ。' },
  { id:'gyo-37-koka', subject:'宅建業法', topic:'37条書面 租税公課の負担(任意的記載事項)', law:'宅建業法', source:'宅建業法37条1項',
    q:'宅地建物取引業者がその媒介により宅地の売買契約を成立させた場合、当該宅地に係る租税その他の公課の負担に関する定めがあるときは、その内容を37条書面に記載しなければならない。',
    answer:true,
    explain:'正しい。租税公課の負担に関する定めは、37条書面の「定めがあるときに記載する」任意的記載事項（37条1項）。「定めがあっても記載不要」は誤り。損害賠償額の予定・違約金も同じく定めがあれば記載。令和元年問34。' },
  { id:'gyo-5-koryu', subject:'宅建業法', topic:'免許の欠格事由 拘留・科料は欠格でない', law:'宅建業法', source:'宅建業法5条1項',
    q:'免許を受けようとする法人の代表取締役が、刑法の侮辱罪により拘留の刑に処せられ、その刑の執行が終わった日から5年を経過していない場合、当該法人は免許を受けることができない。',
    answer:false,
    explain:'誤り。拘留・科料は免許の欠格事由ではない。刑罰による欠格は、拘禁刑以上＝罪名を問わず5年、罰金＝宅建業法違反・傷害・暴行・脅迫・背任等の一定の罪のみ5年。拘留にとどまる場合は欠格とならず免許を受けられる。執行猶予は満了すれば欠格が消える。令和元年問43。' },
  { id:'gyo-toroku-koshu', subject:'宅建業法', topic:'登録実務講習と宅建士証交付講習の区別', law:'宅建業法', source:'宅建業法18条・22条の2',
    q:'宅地建物取引士資格試験に合格した者は、宅地建物取引の実務経験が2年に満たない場合でも、合格の日から1年以内に登録を受けようとするときは、登録実務講習を受講する必要はない。',
    answer:false,
    explain:'誤り。実務経験2年未満の者が登録を受けるには登録実務講習（国土交通大臣の登録を受けた講習）が必要で、合格後1年以内かどうかは無関係。合格後1年以内で免除されるのは、宅地建物取引士証の交付を受ける際の法定講習（知事の講習）であって、登録実務講習ではない。両講習の混同が急所。令和元年問44。' },
  { id:'gyo-houshu-01', subject:'宅建業法', topic:'報酬額の制限(速算式・消費税)', law:'宅建業法', source:'宅建業法46条・告示第二',
    q:'宅建業者A（課税事業者）が代金2,000万円の土地の売買を売主から媒介し成立させた。Aが売主から受け取れる報酬の上限は66万円である。',
    answer:false,
    explain:'×。速算式で2,000万×3%＋6万＝66万円は本体（税抜）。課税事業者は消費税を上乗せでき、66万×1.1＝72万6,000円が上限。告示第二の表は税込で5.5/4.4/3.3%。' },
  { id:'gyo-houshu-02', subject:'宅建業法', topic:'低廉な空家等の特例(令和6年改正)', law:'宅建業法', source:'告示第七(令和6年7月1日施行)',
    q:'低廉な空家等の売買の媒介の報酬特例の対象は、売買代金が400万円以下の宅地又は建物である。',
    answer:false,
    explain:'×。令和6年7月1日改正で対象が代金800万円以下に拡大（旧400万円以下）。媒介で依頼者から受ける上限も33万円（税込・本体30万円）に引き上げられた。' },
  { id:'gyo-houshu-03', subject:'宅建業法', topic:'報酬額の制限(代理の合計2倍の天井)', law:'宅建業法', source:'告示第三ただし書',
    q:'宅建業者A（課税事業者）が売主の代理として売買を成立させ、売主から媒介額の2倍に相当する報酬を受け取った。Aは、これに加えて買主からも報酬を受け取ることができる。',
    answer:false,
    explain:'×。告示第三ただし書は、代理業者が相手方からも報酬を受ける場合、その額と代理の依頼者から受ける額の合計が第二（媒介）の2倍を超えてはならないと定める。既に2倍を受領しているので買主からは受け取れない。「代理＝2倍」は業者数でなく1業者の取引全体の天井。' },
  { id:'gyo-houshu-04', subject:'宅建業法', topic:'報酬額の制限(基礎額は税抜代金)', law:'宅建業法', source:'告示第二(消費税等相当額を含まない)',
    q:'建物代金2,200万円（うち消費税200万円）と土地代金3,000万円の売買を媒介する場合、報酬計算の基礎となる代金額は5,200万円である。',
    answer:false,
    explain:'×。報酬計算の基礎は税抜代金（告示第二は「消費税等相当額を含まない」と規定）。建物は税抜2,000万円、土地は非課税でそのまま3,000万円、基礎額は5,000万円。消費税は入口（代金）で外し、出口（報酬）で課税事業者なら×1.1する。' },
  { id:'ken-saiken-01', subject:'権利関係', topic:'契約解除と帰責事由(541・543条)', law:'民法', source:'民法541条・543条',
    q:'買主が代金を支払わない場合でも、その不履行について債務者（買主）に帰責事由がなければ、売主は契約を解除することができない。',
    answer:false,
    explain:'×。2017年改正で解除は「債権者を契約の拘束から解放する制度」と整理され、債務者の帰責事由は解除の要件でない。541条の催告解除も542条の無催告解除も帰責事由を要しない。ただし債権者(売主)自身の帰責事由による不履行のときは543条で解除不可。' },
  { id:'ken-saiken-02', subject:'権利関係', topic:'危険負担(536条)', law:'民法', source:'民法536条1項',
    q:'双務契約で、当事者双方の責めに帰することができない事由により債務の履行が不能となったとき、債権者は反対給付の履行を拒むことができる。',
    answer:true,
    explain:'正しい。536条1項の履行拒絶権。なお代金債務が当然に消滅するわけではなく、契約自体を解消するには542条1項1号(全部履行不能)で解除する。旧534条の債権者主義は改正で廃止。' },
  { id:'ken-keiyaku-01', subject:'権利関係', topic:'契約不適合の期間制限(566条)', law:'民法', source:'民法566条',
    q:'引き渡された土地が契約で定めた数量に不足していた場合、買主は、その不適合を知った時から1年以内にその旨を売主に通知しなければ、代金減額を請求できなくなる。',
    answer:false,
    explain:'×。566条の「知った時から1年以内の通知」は種類・品質の不適合に限られる。数量不足は566条の対象外で、一般の消滅時効（166条＝知った時から5年／行使できる時から10年）による。' },
  { id:'ken-keiyaku-02', subject:'権利関係', topic:'契約不適合と帰責事由(562・563・564条)', law:'民法', source:'民法562・563・564条',
    q:'契約不適合を理由とする買主の追完請求および代金減額請求は、売主に帰責事由がある場合にのみ認められる。',
    answer:false,
    explain:'×。追完請求(562)・代金減額請求(563)は売主の帰責事由を要しない（契約不適合という客観的事実で発生・ただし買主の帰責事由があると不可）。売主の帰責事由が必要なのは損害賠償(564→415)のみ。' },
  { id:'hou-kukaku-01', subject:'法令制限', topic:'仮換地の指定の効果', law:'土地区画整理法', source:'土地区画整理法99条1項',
    q:'仮換地の指定を受けた者は、その仮換地を使用収益できるようになるとともに、その仮換地の所有権を取得する。',
    answer:false,
    explain:'×。99条1項で移るのは使用収益の権能のみ。所有権・登記名義は従前の宅地のままで、所有権が換地に確定的に移るのは換地処分の公告があった日の翌日（104条1項）。' },
  { id:'hou-kukaku-02', subject:'法令制限', topic:'保留地の帰属', law:'土地区画整理法', source:'土地区画整理法104条11項',
    q:'土地区画整理事業の保留地は、換地処分の公告があった日の翌日において、施行者が取得する。',
    answer:true,
    explain:'正しい。104条11項。換地・清算金も含め換地処分の効果は公告の翌日に発生する（換地は従前の宅地とみなされ＝104条1項、清算金は確定＝104条8項）。' },
  { id:'hou-kukaku-03', subject:'法令制限', topic:'換地処分の時期(工事完了前の例外)', law:'土地区画整理法', source:'土地区画整理法103条2項',
    q:'換地処分は、施行地区の全部について土地区画整理事業の工事が完了した後でなければすることができず、規約・定款・施行規程で別段の定めをしても、工事完了前に換地処分をすることはできない。',
    answer:false,
    explain:'誤り。103条2項本文は「工事完了後、遅滞なく」だが、ただし書で規準・規約・定款・施行規程に別段の定めがあるときは工事完了前でも換地処分できる。「例外なく完了後」は誤り。' },
  { id:'gyo-gyomu-01', subject:'宅建業法', topic:'業務上の禁止(47条2号)', law:'宅建業法', source:'宅建業法47条2号',
    q:'宅建業者が取引の相手方に不当に高額の報酬を要求したが、実際にはその額を受領しなかった場合、宅建業法には違反しない。',
    answer:false,
    explain:'×。47条2号は「不当に高額の報酬を要求する行為」を禁止しており、要求した時点で違反が成立する（受領は不要）。なお、上限を超えた額を実際に受領した場合は46条2項違反となる。' },
  { id:'gyo-senin-01', subject:'宅建業法', topic:'専任宅建士の補充(31条の3)', law:'宅建業法', source:'宅建業法31条の3第3項',
    q:'宅建業者は、既存の事務所が専任の宅地建物取引士の設置数を欠くに至ったときは、30日以内に必要な措置を執らなければならない。',
    answer:false,
    explain:'×。31条の3第3項により2週間以内に適合させる措置（補充等）が必要。事務所では業務従事者の1/5以上、案内所等では1人以上の成年者である専任宅建士を置く。' },
  { id:'ken-chintai-01', subject:'権利関係', topic:'敷金返還と明渡しの先後(622条の2)', law:'民法', source:'民法622条の2第1項1号',
    q:'建物賃貸借が終了した場合、賃借人は、賃貸人から敷金の返還を受けるまで、建物の明渡しを拒むことができる（同時履行）。',
    answer:false,
    explain:'×。622条の2第1項1号は「賃貸借が終了し、かつ、賃貸物の返還を受けたとき」に返還義務が生じると定める＝明渡しが先履行。賃借人は敷金返還と引き換えに明渡しを拒む（同時履行を主張する）ことはできない。' },
  { id:'gyo-kantoku-01', subject:'宅建業法', topic:'監督処分の処分権者(65・66条)', law:'宅建業法', source:'宅建業法65条3項4項・66条',
    q:'宅建業者が業務を行った区域を管轄する都道府県知事は、その業者の免許権者でなくても、当該業者に対し業務停止を命じ、又は免許を取り消すことができる。',
    answer:false,
    explain:'×。現地知事は自区域内の業務について指示処分・業務停止処分はできる（65条3項4項）が、免許の取消しは免許権者（免許をした大臣・知事）のみが行える（66条）。地位を与えた者だけが地位を奪える。' },
  { id:'ken-souzoku-02', subject:'権利関係', topic:'配偶者居住権の対抗要件(1031条)', law:'民法', source:'民法1031条',
    q:'配偶者居住権を取得した配偶者は、居住建物に現に居住している事実があれば、その後に建物を取得した第三者に配偶者居住権を対抗することができる。',
    answer:false,
    explain:'×。配偶者居住権の対抗要件は登記（1031条・605条準用）。居住建物の所有者は登記を備えさせる義務を負い、配偶者は登記請求権を持つ。居住の事実では対抗できない（引渡しで対抗できる借家とは異なる）。' },
  { id:'hou-toshi-01', subject:'法令制限', topic:'市街化調整区域の建築許可(都計法43条)', law:'都市計画法', source:'都市計画法43条1項',
    q:'市街化調整区域のうち開発許可を受けた開発区域以外の区域内で、土地の区画形質の変更（開発行為）を伴わずに建築物を新築する場合は、都道府県知事の許可は不要である。',
    answer:false,
    explain:'×。43条1項により、市街化調整区域では開発行為を伴わなくても建築そのものに知事の許可が必要（例外＝29条1項2号3号の農林漁業用・公益建築物、都計事業・非常災害・仮設等）。市街化調整区域は開発許可(29)と建築許可(43)の二重関門。' },
  { id:'hou-toshi-42-01', subject:'法令制限', topic:'開発許可区域内の建築制限(都計法42条)', law:'都市計画法', source:'都市計画法42条1項',
    q:'開発許可を受けた開発区域内において、工事完了の公告があった後は、その開発区域について用途地域が定められている場合であっても、開発許可に係る予定建築物以外の建築物を新築することはできない。',
    answer:false,
    explain:'×。42条1項は公告後は予定建築物等以外の新築等を禁止するが、ただし書により用途地域等が定められているときは制限が外れ、予定建築物以外も建築できる（知事が支障なしと認めて許可した場合も可）。用途地域があれば建基法48条等の用途規制で街のコントロールが働くため、42条で予定建築物に縛る必要がなくなる。' },
  { id:'hou-toshi-4_11-01', subject:'法令制限', topic:'第二種特定工作物の規模(都計法4条11項・令1条2項)', law:'都市計画法', source:'都市計画法4条11項・12項／施行令1条2項',
    q:'市街化調整区域において、野球場の建設を目的とした8,000㎡の土地の区画形質の変更を行おうとする者は、市街化調整区域には規模の要件がないため、都道府県知事の開発許可を受けなければならない。',
    answer:false,
    explain:'×。施行令1条2項は野球場・庭球場・陸上競技場・遊園地・動物園その他の運動レジャー施設と墓園について「その規模が一ヘクタール以上のもの」を第二種特定工作物とする。8,000㎡は1ha未満なので特定工作物に当たらず、4条12項の「開発行為」でもないため許可不要。市街化調整区域に規模要件がないのは「開発行為であること」を前提とした話。なお法4条11項本文が名指しする「ゴルフコース」は規模を問わず第二種特定工作物。' },
  { id:'hou-kenchiku-53_3-01', subject:'法令制限', topic:'建蔽率の緩和と地域別の建築物(建基法53条3項1号)', law:'建築基準法', source:'建築基準法53条3項1号',
    q:'建蔽率の限度が10分の8とされている地域外で、かつ防火地域内にある準耐火建築物については、都市計画において定められた建蔽率の数値に10分の1を加えた数値が限度となる。',
    answer:false,
    explain:'×。53条3項1号は「防火地域…内にあるイに該当する建築物又は準防火地域内にあるイ若しくはロのいずれかに該当する建築物」と定める。防火地域で+1/10を受けられるのはイ（耐火建築物等）だけで、準耐火建築物等（ロ）が認められるのは準防火地域のみ。地域によって要求される建築物の種別が非対称である点が急所。' },
  { id:'hou-toshi-9_15-01', subject:'法令制限', topic:'特定用途制限地域の対象区域(都計法9条15項)', law:'都市計画法', source:'都市計画法9条15項・13条1項7号・8条2項',
    q:'特定用途制限地域は、用途地域が定められていない土地の区域であれば、市街化調整区域内にも定めることができる。',
    answer:false,
    explain:'×。9条15項は「用途地域が定められていない土地の区域（市街化調整区域を除く。）内において」と括弧書きで市街化調整区域を明示的に除外している。実際に定められるのは未線引き都市計画区域と準都市計画区域（8条2項が2号の2を掲げる）。市街化区域は13条1項7号で「少なくとも用途地域を定めるものとし」とされ入口要件を満たさない。' },
  { id:'hou-toshi-9_18-01', subject:'法令制限', topic:'高度地区と高度利用地区の区別(都計法9条18項・19項)', law:'都市計画法', source:'都市計画法9条18項・19項',
    q:'高度地区は、用途地域内において市街地の環境を維持し、又は土地利用の増進を図るため、建築物の容積率の最高限度及び最低限度を定める地区である。',
    answer:false,
    explain:'×。高度地区（9条18項）が定めるのは「建築物の高さの最高限度又は最低限度」。容積率の最高限度及び最低限度を定めるのは高度利用地区（9条19項。ほかに建蔽率の最高限度・建築面積の最低限度・壁面の位置の制限も定める）。「高度」の語で両者を取り違えるのが典型のひっかけ。' },
  { id:'gyo-27-01', subject:'宅建業法', topic:'営業保証金の還付の限度(27条)', law:'宅建業法', source:'宅建業法27条1項',
    q:'宅地建物取引業者と宅地建物取引をした者（宅地建物取引業者を除く）は、その取引により生じた債権について、その債権額が供託された営業保証金の額を超える場合であっても、営業保証金からその債権の全額の弁済（還付）を受けることができる。',
    answer:false,
    explain:'×。27条1項は「供託した営業保証金について」弁済を受ける権利と定めるにとどまり、還付は営業保証金の額（本店1,000万＋支店各500万）を限度とする。債権額がこれを超えても超過分は還付されず、「全額」還付されるとは限らない。' },
  { id:'gyo-26-01', subject:'宅建業法', topic:'事務所新設の営業保証金 供託と届出(26条2項→25条4項・5項)', law:'宅建業法', source:'宅建業法26条1項・2項／25条1項・4項・5項',
    q:'甲県知事免許の宅地建物取引業者Aは、甲県内に支店を1つ新設した。Aが本店のもよりの供託所に500万円の営業保証金を供託した場合、Aはその時点から当該支店で事業を開始することができる。',
    answer:false,
    explain:'×。供託所（本店のもより）も額（支店500万）も正しいが、開始できる時点が誤り。26条2項が準用する25条4項で供託書の写しを添付して免許権者に届け出る義務が生じ、25条5項は「前項の規定による届出をした後でなければ、その事業を開始してはならない」と定める。したがって供託→届出→開始の順で、供託だけでは開始できない。誤り肢の型＝要件を1つ削る。あわせて、肢の前半（供託所・額）が正しいために後半の検証が止まる形でもある（2026-08-02 実物 令和2年 問35肢2で失点）。' },
  { id:'gyo-78-01', subject:'宅建業法', topic:'業者間取引で適用が外れる範囲(78条2項)と37条3項の記名', law:'宅建業法', source:'宅建業法78条2項・37条3項',
    q:'宅地建物取引業者Aが、宅地建物取引業者Bを買主として宅地を売却し売買契約を締結した。この場合、買主Bが宅地建物取引業者であるから、Aが作成する37条書面に宅地建物取引士をして記名させる必要はない。',
    answer:false,
    explain:'×。78条2項が業者間取引について適用を除外するのは「第三十三条の二及び第三十七条の二から第四十三条まで」＝33条の2と8種制限の残り7つだけで、37条は含まれない。除外が始まるのは枝番のついた「37条の2」からであり、「37条」と「37条の2」の一字違いがそのまま適用と除外の境界になっている。したがって37条3項の記名義務は業者間取引でもそのまま働く。37条3項にも37条1項柱書にも、相手方が業者かどうかによる場合分けはない。誤り肢の型＝枝番の境界（2026-08-02 実物 令和2年 問33で失点）。' },
  { id:'gyo-78-02', subject:'宅建業法', topic:'業者間で外れる側を適用してしまう誤り(78条2項→41条の2・39条1項)', law:'宅建業法', source:'宅建業法78条2項・41条の2第1項・39条1項／施行令3条の5',
    q:'宅地建物取引業者Aが自ら売主として、宅地建物取引業者Bとの間で、造成工事の完了後の宅地（代金3,000万円）の売買契約を締結した。この場合Aは、法第41条の2に定める手付金等の保全措置を講じなければ、当該宅地の引渡し前にBから手付金800万円を受領することはできない。',
    answer:false,
    explain:'×。78条2項が業者相互間の取引について適用を除外するのは「第三十三条の二及び第三十七条の二から第四十三条まで」で、41条の2（手付金等の保全）も39条（手付の額の制限）もこの範囲に入る。買主Bが宅地建物取引業者なので両方とも外れ、Aは保全措置を講じずに800万円を受領できる。なお800万円は代金3,000万円の約26.7％で、非業者が買主なら39条1項の「10分の2」（600万円）も超えるが、これも同じ78条2項で外れる。1つの肢に8種制限が2つ隠れており、まとめて外れる。誤り肢の型＝除外リストの逆向き（外れる条文を適用してしまう。2026-08-06 実物 令和2年 問42肢3で失点。同じ78条2項を2026-08-02 問33では「外れない条文を外す」向きで失点しており、両方向で問われる）。' },
  { id:'gyo-39-02', subject:'宅建業法', topic:'手付解除を妨げるのは「相手方の」着手(39条2項ただし書)', law:'宅建業法', source:'宅建業法39条2項／民法557条1項',
    q:'宅地建物取引業者Aが自ら売主として、宅地建物取引業者でないBとの間で建物の売買契約を締結し、Bから手付を受領した。Bが契約の履行に着手した後であっても、Aは手付の倍額をBに現実に提供すれば、契約を解除することができる。',
    answer:false,
    explain:'×。39条2項ただし書は「その相手方が契約の履行に着手した後は、この限りでない」と定める。「その相手方」とは解除権を行使しようとする者から見た相手方であり、ここで解除しようとしているのは売主Aだから相手方はB。Bが履行に着手した後は、Aは倍額を現実に提供しても解除できない。裏返すと、A自身が履行に着手していてもBが未着手ならBは手付を放棄して解除できる（妨げるのは相手方の着手だけ）。この時的限界は民法557条1項ただし書と同じ文言で、39条が民法に上乗せしたのは1項の2割制限と2項の「いかなる性質のものであつても」の2点だけ。誤り肢の型＝本文だけ読んでただし書の検証が止まる（2026-08-06 実物 令和2年 問32肢1で失点）。' },
  { id:'gyo-64_8-01', subject:'宅建業法', topic:'弁済業務保証金の還付の上限は分担金でなく営業保証金相当額(64条の8第1項)', law:'宅建業法', source:'宅建業法64条の8第1項／施行令2条の4・7条',
    q:'宅地建物取引業保証協会の社員である宅地建物取引業者A（事務所は本店のみ）と宅地建物取引業に関し取引をした者（宅地建物取引業者に該当しない者）は、その取引により生じた債権に関し、Aが協会に納付した弁済業務保証金分担金60万円の範囲内で、弁済業務保証金について弁済を受ける権利を有する。',
    answer:false,
    explain:'×。64条の8第1項の上限は「当該社員が社員でないとしたならばその者が供託すべき第二十五条第二項の政令で定める営業保証金の額に相当する額の範囲内」であり、施行令2条の4により本店のみなら1,000万円。Aが実際に納付した分担金（施行令7条＝主たる事務所60万円・その他の事務所ごとに30万円）の額ではない。社員の負担は60万円でも取引相手の保護は営業保証金と同じ1,000万円という非対称が保証協会制度の核心で、「分担金の範囲内」と書く肢はその核心を消しにかかっている。誤り肢の型＝制度の要となる数字のすり替え（2026-08-06 実物 令和2年 問36肢1で失点）。' },
  { id:'gyo-64_9-01', subject:'宅建業法', topic:'保証協会 新設事務所の分担金(64条の9)', law:'宅建業法', source:'宅建業法64条の9第2項・3項',
    q:'宅地建物取引業保証協会の社員が、加入後に新たに事務所を設置したときは、その日から2週間以内に弁済業務保証金分担金を協会に納付しなければならず、これを納付しないときは社員の地位を失う。',
    answer:true,
    explain:'○。64条の9第2項により新設事務所分の分担金は設置日から2週間以内に納付。同条3項によりこの期間内に納付しないと社員の地位を失う（地位喪失後は1週間以内に営業保証金を供託しないと事業を継続できない・64条の15）。' },
  { id:'hou-nochi-03', subject:'法令制限', topic:'農地法4条/5条の切り分け', law:'農地法', source:'農地法5条1項',
    q:'自己の農地を農地以外のものにするため、その所有権を第三者に移転する場合には、原則として農地法4条の許可を受けなければならない。',
    answer:false,
    explain:'×。農地を農地以外にするため所有権を移転する（転用＋権利移動）場合は農地法5条の許可。4条は権利移動を伴わない自己転用専用。3条＝権利移動のみ／4条＝自己転用のみ／5条＝転用＋権利移動。' },
  { id:'hou-nochi-04', subject:'法令制限', topic:'農地法 市街化区域内の特例', law:'農地法', source:'農地法4条1項・5条1項6号',
    q:'市街化区域内にある農地を農地以外のものに転用する場合には、あらかじめ農業委員会に届け出れば、農地法4条又は5条の許可を受ける必要はない。',
    answer:true,
    explain:'○。市街化区域内の農地の転用は、あらかじめ農業委員会に届け出れば許可不要（4条1項の市街化区域の号・5条1項6号）。この特例は4条・5条のみで、3条（権利移動）には市街化区域特例がなく農業委員会の許可が必要。' },
  { id:'hou-nochi-05', subject:'法令制限', topic:'農地法 3条には市街化区域特例なし', law:'農地法', source:'農地法3条1項・4条1項・5条1項6号',
    q:'市街化区域内にある農地を、農地のまま耕作の目的で売買する場合には、あらかじめ農業委員会に届け出れば、農地法3条の許可を受ける必要はない。',
    answer:false,
    explain:'×。市街化区域の届出特例（許可不要）は転用が絡む4条・5条だけ。3条（農地を農地のまま権利移動）には市街化区域特例がなく、市街化区域内でも農業委員会の許可が必要（届出では済まない）。「転用が絡む4条5条＝届出／3条＝特例なし・許可」で固定。' },
  { id:'gyo-37_2-02', subject:'宅建業法', topic:'8種制限(37条の2 8日の起算日と発信主義)', law:'宅建業法', source:'宅建業法37条の2第1項1号・2項／民法138条・140条',
    q:'宅地建物取引業者Aが自ら売主となる宅地の売買で、宅地建物取引業者でない買主Bは喫茶店で買受けの申込みをし、その場でAからクーリング・オフについて書面で告げられた。Bが、告げられた日の翌日から起算して8日目に契約の解除の書面を発送し、その書面が10日目にAに到達した場合、Bは契約を解除することができる。',
    answer:false,
    explain:'×。37条の2第1項1号は「その告げられた日から起算して八日を経過したとき」＝起算日は告げられた日そのもの（初日算入）。肢は起算日を1日後ろにずらしており、条文の数え方では発送は9日目＝すでに8日を経過している。2項の発信主義（書面を発した時に効力を生ずる）は正しいが、その発信自体が期間経過後なので解除できない。到達が10日目である点は結論に影響しないノイズ。誤り肢の型＝起算点のすり替え＋発信主義に気を取られて日数の検算が止まる（2026-08-03 実物 令和2年 問40アで失点。従前の「発信主義か到達主義か」だけを問う形は、落ちる地点を測れていなかったので事例型に作り直した）。' },
  { id:'gyo-37_2-03', subject:'宅建業法', topic:'8種制限(37条の2 クーリング・オフができなくなる場合)', law:'宅建業法', source:'宅建業法37条の2第1項2号',
    q:'買主が、クーリング・オフができる旨を書面で告げられた日から8日を経過する前であっても、宅地の引渡しを受け、かつその代金の全額を支払った場合には、クーリング・オフによる契約の解除をすることができない。',
    answer:true,
    explain:'正しい。37条の2第1項は2つの締切りを定める：①告げられた日から起算して8日を経過したとき（1号）、②引渡しを受け、かつ代金の全部を支払ったとき（2号）。②に該当すれば8日経過前でもクーリング・オフ不可。8日と「引渡し＋代金全部」は別々の不可事由で、どちらか一方でも満たせばできなくなる。' },
  { id:'hou-kukaku-107_3-01', subject:'法令制限', topic:'換地処分に伴う登記の制限の起点(区画整理法107条3項)', law:'土地区画整理法', source:'土地区画整理法107条3項・99条1項',
    q:'仮換地の指定があった日後、土地区画整理事業の施行による施行地区内の土地及び建物の変動に係る登記がされるまでの間は、原則として、施行地区内の土地及び建物に関して他の登記をすることができない。',
    answer:false,
    explain:'×。107条3項が他の登記を制限する起点は「第百三条第四項の公告があつた日後」＝換地処分の公告後であって、仮換地の指定ではない。例外も「登記の申請人が確定日付のある書類によりその公告前に登記原因が生じたことを証明した場合」で、基準時は公告。仮換地の指定で移るのは使用収益権能だけで登記簿上の権利は動かない（99条1項）ため、登記を止める必要がない。止めるのは所有権等が一斉に動く換地処分の公告以後。' },
  { id:'hou-nochi-5_1-01', subject:'法令制限', topic:'一時的な転用と5条許可(農地法5条1項)', law:'農地法', source:'農地法5条1項本文・各号／農地法施行規則53条',
    q:'砂利採取法による認可を受けた採取計画に従って砂利採取のために農地を一時的に貸し付ける場合、農地法第5条第1項の許可は不要である。',
    answer:false,
    explain:'×。5条1項本文は「農地を農地以外のものにするため…第三条第一項本文に掲げる権利を設定し、又は移転する場合」に許可を要求しており、一時的か恒久的かを区別していない。1項の例外は全7号（国・都道府県等の施設／各種促進計画／収用／市街化区域内の届出／省令）で、7号が委任する施行規則53条（全20号）にも砂利採取に係るものはない。規則53条で「一時的に」の語があるのは20号（地方公共団体が文化財保護法99条1項の発掘を行う場合）のみ。' },
  { id:'gyo-35_2-01', subject:'宅建業法', topic:'供託所等に関する説明(35条の2)と37条書面の区別', law:'宅建業法', source:'宅建業法35条の2・37条1項',
    q:'宅地建物取引業者Aが自ら売主として、宅地建物取引業者でないBとの間で宅地の売買契約を締結した。Aは、営業保証金を供託した主たる事務所の最寄りの供託所及びその所在地を、37条書面に記載しなければならない。',
    answer:false,
    explain:'×。供託所等は37条書面の記載事項ではない（37条1項各号1〜12号に供託所等の号はない）。35条の2が求めるのは「契約が成立するまでの間に説明をするようにしなければならない」＝書面の記載事項ではなく説明であり、時期も契約成立前で37条書面（契約成立後・遅滞なく交付）とは逆。さらに35条の2は括弧書きで相手方が宅地建物取引業者である場合を除いている。誤り肢の型＝説明義務を別の書面の記載事項にすり替える（2026-08-03 実物 令和2年 問37イで失点）。' },
  { id:'gyo-48-01', subject:'宅建業法', topic:'従業者名簿の記載事項と保存(48条3項・規則17条の2)', law:'宅建業法', source:'宅建業法48条3項・4項／施行規則17条の2第1項4号・4項',
    q:'宅地建物取引業者Aは、甲事務所の従業者Bが退職したため、個人情報保護の観点から、従業者名簿のBに関する記載を退職日にすべて消去した。この取扱いは宅地建物取引業法に違反しない。',
    answer:false,
    explain:'×。施行規則17条の2第1項4号は「当該事務所の従業者でなくなつたときは、その年月日」を記載事項として定めており、退職は記載を消す事由ではなく記載を積み増す事由。さらに同条4項は従業者名簿を「最終の記載をした日から十年間保存」しなければならないと定めるので、消去は記載事項と保存義務の両方に反する。制度目的は、取引時に在籍していた従業者を後から追跡できるようにすること（48条4項で取引の関係者の請求による閲覧に供する）。誤り肢の型＝もっともらしい理由（個人情報保護）を付けて条文と逆の結論を導く（2026-08-03 実物 令和2年 問39肢3で失点）。' },

  // ---- 4肢の問（2026-08-12 追加。すべて同日に e-Gov 逐語確認）----
  { id:'ho-kb6-4a', subject:'法令制限', topic:'建築確認の要否（6条1項の号ごとの軸）', law:'建築基準法', source:'建築基準法6条1項柱書・1〜3号・2項', due:'2026-08-13',

    explain:'誤りは2。6条1項柱書は「第一号若しくは第二号に掲げる建築物を建築しようとする場合…これらの建築物の大規模の修繕若しくは大規模の模様替をしようとする場合又は第三号に掲げる建築物を建築しようとする場合」と書き分けており、修繕・模様替が対象になるのは1号2号の建築物だけ。2階建て300㎡は2号（二以上の階数を有し、又は延べ面積が200㎡を超える）に当たるので修繕でも確認が要る。1＝3号は場所だけを定め規模の要件がないので平家100㎡でも必要。3＝1号2号のいずれにも当たらず、3号は「建築」に限られるので模様替は対象外。4＝6条2項。※新築には2項は効かない（増築・改築・移転の3つのみ）。' },

  { id:'ho-kb2126-4a', subject:'法令制限', topic:'天井の高さ（令21条2項）と防火壁の1,000㎡区画（26条）', law:'建築基準法', source:'建築基準法施行令21条2項／建築基準法26条1項本文・ただし書1号2号', due:'2026-08-13',

    answer:0,

  { id:'ken-hosho-448-4a', subject:'権利関係', topic:'保証の付従性と主たる債務者について生じた事由（448条・457条）', law:'民法', source:'民法448条1項2項・457条1項3項', due:'2026-08-16',

  { id:'ken-hosho-kyusho-4a', subject:'権利関係', topic:'保証人の求償権の3軸（委託の有無・弁済期の前後・通知）', law:'民法', source:'民法459条1項・459条の2第1項3項・462条1項2項', due:'2026-08-16',

  { id:'ho-kb56-7-4a', subject:'法令制限', topic:'斜線制限を外す経路②＝56条7項（政令の基準・測定位置）', law:'建築基準法', source:'建築基準法56条7項柱書・1〜3号／同条1項2号3号', due:'2026-08-16',

  { id:'ho-takasa-hazusu-4a', subject:'法令制限', topic:'高さの制限から外れる経路（55条・56条・56条の2の非対称）', law:'建築基準法', source:'建築基準法55条4項1号・5項／44条2項／56条7項／56条の2第1項ただし書', due:'2026-08-16',

  { id:'gyo-meibo-todoke-4a', subject:'宅建業法', topic:'業者名簿の登載事項と変更の届出（欠ける号が逆）', law:'宅建業法', source:'宅建業法8条2項1号2号／9条1項／4条1項5号6号', due:'2026-08-15',

  { id:'gyo-37-2-taishaku-4a', subject:'宅建業法', topic:'37条書面（貸借）に持ち込まれる記載事項', law:'宅建業法', source:'宅建業法37条1項各号・2項1号2号3号', due:'2026-08-15',
    q:'宅地建物取引業者が建物の貸借の媒介をし賃貸借契約が成立した場合に交付すべき37条書面について、正しいものはどれか。',

/* =========================================================
   状態管理（localStorage に誤答を記録 → R2 誤答バンクへ発展）
   ========================================================= */
const LS_KEY = 'examv6_stats_v1';
function loadStats(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ return {}; } }
function saveStats(s){ try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} }
function recordResult(id, correct){
    const s = loadStats();
    if(!s[id]) s[id] = { seen:0, wrong:0, lastWrong:false };
    s[id].seen++;
    if(!correct){ s[id].wrong++; }
    s[id].lastWrong = !correct;
    saveStats(s);
}
function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dueQuestions(){ const t = todayStr(); return QUESTIONS.filter(q => q.due && q.due <= t); }

function wrongIds(){
    const s = loadStats();
    return Object.keys(s).filter(id => s[id].lastWrong);
}

/* 誤答リストを Markdown で書き出す（Claude が読めるようにファイル化する）
   出力先はブラウザの既定ダウンロードフォルダ。ファイル名に日付が入る。 */
function exportWrong(){
    const s = loadStats();
    const ids = wrongIds();
    const now = new Date();
    const p2 = n => String(n).padStart(2,'0');
    const stamp = `${now.getFullYear()}-${p2(now.getMonth()+1)}-${p2(now.getDate())}`;
    const time = `${p2(now.getHours())}:${p2(now.getMinutes())}`;

    let last = null;
    try { last = JSON.parse(localStorage.getItem('examv6_last')); } catch(e){}

    const lines = [];
    lines.push(`# exam_v6 誤答リスト ${stamp} ${time}`);
    lines.push('');
    if(last) lines.push(`- 直近の結果：**${last.score} / ${last.total}**（正答率 ${Math.round(last.score/last.total*100)}%）`);
    lines.push(`- 収録問題数：${QUESTIONS.length}問`);
    lines.push(`- 誤答バンク：**${ids.length}問**（直近の解答が誤りだったもの）`);
    lines.push('');

    if(ids.length === 0){
        lines.push('誤答バンクは空です。');
    } else {
        // 科目ごとにまとめる
        const bySub = {};
        ids.forEach(id => {
            const q = QUESTIONS.find(x => x.id === id);
            if(!q) return;
            (bySub[q.subject] = bySub[q.subject] || []).push({ q, st: s[id] });
        });
        Object.keys(bySub).forEach(sub => {
            lines.push(`## ${sub}（${bySub[sub].length}問）`);
            lines.push('');
            lines.push('| id | 論点 | 根拠 | 正解 | 出題/誤答 | 問題文 |');
            lines.push('|---|---|---|:--:|:--:|---|');
            bySub[sub].forEach(({q, st}) => {
                const qt = q.q.replace(/\|/g, '／');
                lines.push(`| \`${q.id}\` | ${q.topic} | ${q.source} | ${q.answer ? '○' : '×'} | ${st.seen}/${st.wrong} | ${qt} |`);
            });
            lines.push('');
        });
    }

    const blob = new Blob([lines.join('\n')], { type:'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `exam_v6_wrong_${stamp}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* =========================================================
   エンジン
   ========================================================= */
let queue = [], idx = 0, score = 0, perSubject = {}, roundWrong = [];

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function show(view){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+view).classList.add('active');
    window.scrollTo(0,0);
}

function renderHome(){
    const grid = document.getElementById('subject-grid');
    grid.innerHTML = '';
    let total = 0;
    Object.keys(SUBJECTS).forEach(sub=>{
        const n = QUESTIONS.filter(q=>q.subject===sub).length;
        total += n;
        const k = SUBJECTS[sub].key;
        const dis = n===0 ? 'opacity-40 cursor-not-allowed' : '';
        const onclick = n===0 ? '' : `onclick="start('subject','${sub}')"`;
        grid.innerHTML += `
          <button ${onclick} class="border-2 bd-${k} rounded-xl p-3 text-left hover:shadow-md transition ${dis}">
            <div class="font-bold c-${k}">${sub}</div>
            <div class="text-xs text-slate-400 mt-1">${n} 問</div>
          </button>`;
    });
    document.getElementById('total-count').textContent = `全 ${total} 問`;

    const d = dueQuestions().length;
    document.getElementById('due-count').textContent = d>0 ? `（${d}問）` : '（なし）';
    document.getElementById('due-btn').disabled = d===0;
    document.getElementById('due-btn').classList.toggle('opacity-40', d===0);
    document.getElementById('due-btn').classList.toggle('cursor-not-allowed', d===0);

    const w = wrongIds().length;
    document.getElementById('wrong-count').textContent = w>0 ? `（${w}問）` : '（なし）';
    document.getElementById('wrong-btn').disabled = w===0;
    if(w===0) document.getElementById('wrong-btn').classList.add('opacity-40','cursor-not-allowed');
    else document.getElementById('wrong-btn').classList.remove('opacity-40','cursor-not-allowed');
}

function start(mode, subject){
    let pool;
    if(mode==='subject') pool = QUESTIONS.filter(q=>q.subject===subject);
    else if(mode==='wrong'){ const w = wrongIds(); pool = QUESTIONS.filter(q=>w.includes(q.id)); }
    else if(mode==='due') pool = dueQuestions();
    else pool = QUESTIONS.slice();
    if(pool.length===0) return;
    queue = shuffle(pool.slice());
    idx = 0; score = 0; perSubject = {}; roundWrong = [];
    show('quiz');
    renderQuestion();
}

const subKey = sub => SUBJECTS[sub] ? SUBJECTS[sub].key : 'gyo';

function renderQuestion(){
    const q = queue[idx];
    document.getElementById('q-counter').textContent = `${idx+1} / ${queue.length}`;
    document.getElementById('q-progress').style.width = (idx/queue.length*100)+'%';

    const badge = document.getElementById('q-subject');
    badge.textContent = q.subject;
    badge.className = `text-xs font-bold px-2.5 py-1 rounded-full text-white bg-${subKey(q.subject)}`;
    document.getElementById('q-topic').textContent = q.topic || '';

    document.getElementById('q-text').textContent = q.q;

    const opts = document.getElementById('q-options');
    opts.innerHTML = '';
    const pairs = q.choices
        ? q.choices.map((c,i)=>[`${i+1}　${c}`, i])
        : [['○ 正しい', true], ['× 誤り', false]];
    pairs.forEach(([label, val])=>{
        const b = document.createElement('button');
        b.className = q.choices ? 'opt-btn choice' : 'opt-btn';
        b.textContent = label;
        b.dataset.val = JSON.stringify(val);
        b.onclick = ()=>answer(val, b);
        opts.appendChild(b);
    });

    document.getElementById('q-explain').classList.add('hidden');
    document.getElementById('q-next').classList.add('hidden');
}

function answer(val, btn){
    const q = queue[idx];
    const correct = (val === q.answer);
    const buttons = document.querySelectorAll('#q-options .opt-btn');
    buttons.forEach(b=>{
        b.disabled = true;
        let bv; try { bv = JSON.parse(b.dataset.val); } catch(e){ bv = null; }
        const isThisCorrect = bv === q.answer;
        if(isThisCorrect) b.classList.add('correct');
        else b.classList.add('muted');
    });
    if(!correct) btn.classList.remove('muted'), btn.classList.add('wrong');

    if(correct) score++;
    perSubject[q.subject] = perSubject[q.subject] || {c:0,n:0};
    perSubject[q.subject].n++; if(correct) perSubject[q.subject].c++;
    if(!correct && !roundWrong.includes(q.id)) roundWrong.push(q.id);
    recordResult(q.id, correct);

    const ex = document.getElementById('q-explain');
    const noteHref = (SUBJECTS[q.subject]||{}).note || 'study_notes.html';
    const lawHref = LAWS[q.law] || '#';
    ex.className = 'mt-5 p-4 rounded-xl text-sm fade-up ' + (correct ? 'bg-emerald-50 text-emerald-900' : 'bg-red-50 text-red-900');
    ex.innerHTML = `
        <div class="font-bold mb-1">${correct ? '正解' : '不正解'}</div>
        <div class="leading-relaxed mb-3">${q.explain}</div>
        <div class="flex flex-wrap gap-3 text-xs font-bold">
            <span class="text-slate-500">根拠：${q.source}</span>
            <a href="${lawHref}" target="_blank" rel="noopener" class="text-blue-600 underline">条文(e-Gov)</a>
            <a href="${noteHref}" class="text-blue-600 underline">学習ノート</a>
        </div>`;
    ex.classList.remove('hidden');

    const nb = document.getElementById('q-next');
    nb.textContent = (idx === queue.length-1) ? '結果を見る' : '次の問題へ →';
    nb.classList.remove('hidden');
}

function next(){
    idx++;
    if(idx >= queue.length){ showResult(); return; }
    renderQuestion();
}

function showResult(){
    document.getElementById('q-progress').style.width = '100%';
    show('result');
    document.getElementById('r-score').textContent = `${score} / ${queue.length}`;
    const pct = Math.round(score/queue.length*100);
    document.getElementById('r-pct').textContent = `正答率 ${pct}%`;

    const bd = document.getElementById('r-breakdown');
    bd.innerHTML = '';
    Object.keys(perSubject).forEach(sub=>{
        const p = perSubject[sub];
        bd.innerHTML += `
          <div class="flex items-center justify-between border-b border-slate-100 pb-1">
            <span class="font-bold c-${subKey(sub)}">${sub}</span>
            <span class="text-slate-600">${p.c} / ${p.n}</span>
          </div>`;
    });

    // 今回間違えた問題を結果画面に一覧表示する
    const wrongThisRound = queue.filter(q => roundWrong.includes(q.id));
    const box = document.getElementById('r-wrong-list');
    const items = document.getElementById('r-wrong-items');
    items.innerHTML = '';
    if(wrongThisRound.length){
        box.classList.remove('hidden');
        wrongThisRound.forEach(q=>{
            items.innerHTML += `
              <li class="border-b border-slate-100 pb-2">
                <span class="font-bold c-${subKey(q.subject)}">${q.subject}</span>
                <span class="text-slate-700">${q.topic}</span>
                <span class="block text-xs text-slate-400 mt-0.5">${q.source}</span>
              </li>`;
        });
    } else {
        box.classList.add('hidden');
    }

    const w = wrongIds().length;
    const rw = document.getElementById('r-retry-wrong');
    rw.disabled = w===0;
    rw.classList.toggle('opacity-40', w===0);
    rw.classList.toggle('cursor-not-allowed', w===0);

    // 直近結果をホームに表示
    try { localStorage.setItem('examv6_last', JSON.stringify({score, total:queue.length, at:Date.now()})); } catch(e){}
}

function goHome(){ renderHome(); show('home'); showLast(); }

function showLast(){
    const el = document.getElementById('last-result');
    try{
        const l = JSON.parse(localStorage.getItem('examv6_last'));
        if(l){
            const d = new Date(l.at);
            el.textContent = `前回：${l.score} / ${l.total}（${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}）`;
            el.classList.remove('hidden');
        }
    }catch(e){}
}

/* 初期化 */
renderHome();
showLast();

/* PWA */
if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
